<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criador de Shorts</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 25px;
      background: #f5f5f5;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input,
    select,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 7px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      margin-top: 25px;
      background: #111;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #resultado {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🎬 Criador de Shorts</h1>

  <label for="tema">Tema do vídeo</label>
  <input
    id="tema"
    type="text"
    placeholder="Ex.: 5 curiosidades sobre o espaço"
  >

  <label for="duracao">Duração</label>
  <select id="duracao">
    <option value="30 segundos">30 segundos</option>
    <option value="45 segundos">45 segundos</option>
    <option value="60 segundos" selected>60 segundos</option>
    <option value="90 segundos">90 segundos</option>
  </select>

  <label for="estilo">Estilo do vídeo</label>
  <select id="estilo">
    <option>Curiosidades</option>
    <option>Mistério</option>
    <option>História</option>
    <option>Motivacional</option>
    <option>Notícias</option>
    <option>Fatos surpreendentes</option>
  </select>

  <label for="voz">Tipo de voz</label>
  <select id="voz">
    <option>Feminina</option>
    <option>Masculina</option>
    <option>Automática</option>
  </select>

  <label for="idioma">Idioma</label>
  <select id="idioma">
    <option>Português brasileiro</option>
    <option>English</option>
    <option>Español</option>
  </select>

  <label for="visual">Estilo visual</label>
  <select id="visual">
    <option>Realista</option>
    <option>Cinematográfico</option>
    <option>Documentário</option>
    <option>Notícias</option>
    <option>Rápido</option>
    <option>Viral</option>
  </select>

  <button onclick="enviar()">
    CRIAR VÍDEO
  </button>

  <p id="resultado"></p>

</div>

<script>
function enviar() {

  const tema = document.getElementById("tema").value.trim();
  const duracao = document.getElementById("duracao").value;
  const estilo = document.getElementById("estilo").value;
  const voz = document.getElementById("voz").value;
  const idioma = document.getElementById("idioma").value;
  const visual = document.getElementById("visual").value;

  if (!tema) {
    document.getElementById("resultado").innerText =
      "Digite um tema primeiro.";
    return;
  }

  const titulo =
    encodeURIComponent("Criar Short: " + tema);

  const corpo =
    encodeURIComponent(
`### TEMA
${tema}

### DURAÇÃO
${duracao}

### ESTILO
${estilo}

### VOZ
${voz}

### IDIOMA
${idioma}

### VISUAL
${visual}

### STATUS
Novo pedido de Short`
    );

  const url =
    "https://github.com/karinaosproject/youtube-shorts-automatico/issues/new" +
    "?title=" + titulo +
    "&body=" + corpo;

  window.location.href = url;
}
</script>

</body>
</html>
