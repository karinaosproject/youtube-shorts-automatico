name: Processar pedido de Short

on:
  issues:
    types: [opened]

jobs:
  processar:
    runs-on: ubuntu-latest

    steps:
      - name: Ler pedido
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          echo "================================"
          echo "🎬 NOVO PEDIDO DE SHORT"
          echo "================================"
          echo "Título:"
          echo "$ISSUE_TITLE"
          echo ""
          echo "Dados do pedido:"
          echo "$ISSUE_BODY"
          echo "================================"
          echo "Automação iniciada!"
