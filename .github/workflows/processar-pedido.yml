name: Processar pedido de Short

on:
  issues:
    types: [opened]

jobs:
  criar-short:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. INSTALAR FERRAMENTAS
      # =========================================================

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar Piper TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install piper-tts

      # =========================================================
      # 2. LER PEDIDO
      # =========================================================

      - name: Ler pedido
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          echo "================================"
          echo "🎬 NOVO PEDIDO DE SHORT"
          echo "================================"
          echo "Título:"
          echo "$ISSUE_TITLE"
          echo ""
          echo "Pedido:"
          echo "$ISSUE_BODY"
          echo "================================"

      # =========================================================
      # 3. GEMINI — ROTEIRO + BUSCA DO PEXELS
      #    UMA ÚNICA REQUISIÇÃO
      # =========================================================

      - name: Gerar roteiro e busca com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          api_key = os.environ["GEMINI_API_KEY"]
          pedido = os.environ["ISSUE_BODY"]

          prompt = f"""
          Você é um roteirista profissional de YouTube Shorts.

          Analise o pedido abaixo e produza:

          1. Um roteiro curto, envolvente e pronto para narração.
          2. Uma expressão curta em inglês para buscar um vídeo vertical
             relacionado ao tema no Pexels.

          REGRAS DO ROTEIRO:
          - Comece com um gancho forte.
          - Não use introdução desnecessária.
          - Use frases curtas.
          - Mantenha ritmo rápido.
          - Seja interessante e fácil de entender.
          - Termine com uma frase de impacto.
          - Escreva em português brasileiro.
          - Entregue somente o conteúdo do roteiro.

          REGRAS DA BUSCA:
          - Inglês.
          - De 1 a 4 palavras.
          - Representar visualmente o tema principal.
          - Não use frases longas.

          PEDIDO:
          {pedido}

          Responda SOMENTE em JSON válido neste formato:

          {{
            "roteiro": "texto do roteiro",
            "busca": "english search query"
          }}
          """

          data = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "responseMimeType": "application/json"
              }
          }

          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent"

          request = urllib.request.Request(
              url,
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": api_key
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  resultado = json.load(response)

          except urllib.error.HTTPError as e:
              print("❌ ERRO DA API GEMINI")
              print("Código:", e.code)
              print(e.read().decode("utf-8"))
              raise

          texto = resultado["candidates"][0]["content"]["parts"][0]["text"]

          dados = json.loads(texto)

          roteiro = dados["roteiro"].strip()
          busca = dados["busca"].strip()

          with open("roteiro.txt", "w", encoding="utf-8") as f:
              f.write(roteiro)

          with open("busca.txt", "w", encoding="utf-8") as f:
              f.write(busca)

          print("================================")
          print("🧠 ROTEIRO GERADO")
          print("================================")
          print(roteiro)
          print("")
          print("🔎 BUSCA PEXELS:")
          print(busca)
          print("================================")
          PY

      # =========================================================
      # 4. BAIXAR VOZ PORTUGUESA DO PIPER
      # =========================================================

      - name: Baixar voz Piper PT-BR
        run: |
          mkdir -p models

          wget -O models/pt_BR-faber-medium.onnx \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx"

          wget -O models/pt_BR-faber-medium.onnx.json \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx.json"

      # =========================================================
      # 5. GERAR NARRAÇÃO SEM GEMINI
      # =========================================================

      - name: Gerar narração com Piper
        run: |
          echo "🎙️ Gerando narração..."

          cat roteiro.txt | \
            python -m piper \
            --model models/pt_BR-faber-medium.onnx \
            --output_file narracao.wav

          echo "================================"
          echo "🎙️ NARRAÇÃO GERADA"
          echo "================================"

          ls -lh narracao.wav

      # =========================================================
      # 6. BUSCAR VÍDEO NO PEXELS
      # =========================================================

      - name: Buscar vídeo no Pexels
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import urllib.parse

          api_key = os.environ["PEXELS_API_KEY"]

          with open("busca.txt", "r", encoding="utf-8") as f:
              busca = f.read().strip()

          params = urllib.parse.urlencode({
              "query": busca,
              "orientation": "portrait",
              "size": "medium",
              "per_page": 10
          })

          url = "https://api.pexels.com/v1/videos/search?" + params

          print("🔎 Pesquisando no Pexels:")
          print(busca)

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": api_key
              }
          )

          try:
              with urllib.request.urlopen(request) as response:
                  resultado = json.load(response)

          except urllib.error.HTTPError as e:
              print("❌ ERRO DO PEXELS")
              print("Código:", e.code)
              print(e.read().decode("utf-8"))
              raise

          videos = resultado.get("videos", [])

          if not videos:
              raise Exception("Nenhum vídeo encontrado no Pexels.")

          video_url = None

          for video in videos:
              arquivos = video.get("video_files", [])

              # Primeiro tenta encontrar vídeo vertical
              for arquivo in arquivos:
                  largura = arquivo.get("width", 0)
                  altura = arquivo.get("height", 0)

                  if altura > largura:
                      video_url = arquivo.get("link")
                      if video_url:
                          break

              if video_url:
                  break

          # Se não encontrar vertical, usa qualquer vídeo disponível
          if not video_url:
              for video in videos:
                  for arquivo in video.get("video_files", []):
                      if arquivo.get("link"):
                          video_url = arquivo["link"]
                          break

                  if video_url:
                      break

          if not video_url:
              raise Exception("Nenhum arquivo de vídeo disponível.")

          print("🎞️ Vídeo encontrado:")
          print(video_url)

          urllib.request.urlretrieve(
              video_url,
              "video-pexels.mp4"
          )

          print("✅ Download concluído.")

          with open("pexels-credit.txt", "w", encoding="utf-8") as f:
              f.write("Vídeo fornecido por Pexels\n")
              f.write("https://www.pexels.com/\n")

          PY

      # =========================================================
      # 7. MONTAR SHORT VERTICAL
      # =========================================================

      - name: Montar Short vertical
        run: |
          ffmpeg \
            -stream_loop -1 \
            -i video-pexels.mp4 \
            -i narracao.wav \
            -map 0:v:0 \
            -map 1:a:0 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -c:a aac \
            -shortest \
            -movflags +faststart \
            short-final.mp4

      # =========================================================
      # 8. SALVAR RESULTADOS
      # =========================================================

      - name: Salvar arquivos gerados
        uses: actions/upload-artifact@v4
        with:
          name: short-gerado
          path: |
            roteiro.txt
            busca.txt
            narracao.wav
            video-pexels.mp4
            short-final.mp4
            pexels-credit.txt
