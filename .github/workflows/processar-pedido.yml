      - name: Montar cenas
        run: |
          python - <<'PY'
          import json
          import subprocess

          with open(
              "plano-edicao.json",
              encoding="utf-8"
          ) as f:

              plano = json.load(f)

          for cena in plano:

              numero = cena["numero"]

              visuais = cena["visuais"]

              arquivos = [
                  (
                      f"clips/"
                      f"cena_{numero}_visual_"
                      f"{i}.mp4"
                  )
                  for i in range(
                      1,
                      len(visuais) + 1
                  )
              ]

              if len(arquivos) == 1:

                  subprocess.run(
                      [
                          "ffmpeg",
                          "-y",
                          "-i",
                          arquivos[0],
                          "-c",
                          "copy",
                          f"cena-video-{numero}.mp4"
                      ],
                      check=True
                  )

                  continue

              inputs = []

              for arquivo in arquivos:

                  inputs.extend([
                      "-i",
                      arquivo
                  ])

              duracoes = []

              for arquivo in arquivos:

                  resultado = subprocess.check_output(
                      [
                          "ffprobe",
                          "-v",
                          "error",
                          "-show_entries",
                          "format=duration",
                          "-of",
                          "default=noprint_wrappers=1:nokey=1",
                          arquivo
                      ]
                  ).decode().strip()

                  duracoes.append(
                      float(resultado)
                  )

              transicao = min(
                  0.25,
                  min(duracoes) / 3.0
              )

              tipos = [
                  "fade",
                  "smoothleft",
                  "wiperight",
                  "slideup",
                  "circleopen"
              ]

              filtros = []

              acumulado = duracoes[0]

              for i in range(
                  1,
                  len(arquivos)
              ):

                  entrada_a = (
                      "[0:v]"
                      if i == 1
                      else f"[v{i-1}]"
                  )

                  entrada_b = (
                      f"[{i}:v]"
                  )

                  saida = (
                      f"[v{i}]"
                      if i < len(arquivos) - 1
                      else "[vfinal]"
                  )

                  offset = (
                      acumulado
                      - transicao
                  )

                  tipo = tipos[
                      (i - 1)
                      % len(tipos)
                  ]

                  filtros.append(
                      f"{entrada_a}"
                      f"{entrada_b}"
                      f"xfade="
                      f"transition={tipo}:"
                      f"duration={transicao}:"
                      f"offset={offset}"
                      f"{saida}"
                  )

                  acumulado += (
                      duracoes[i]
                      - transicao
                  )

              filtro_complexo = ";".join(
                  filtros
              )

              comando = [
                  "ffmpeg",
                  "-y"
              ]

              comando.extend(
                  inputs
              )

              comando.extend([
                  "-filter_complex",
                  filtro_complexo,
                  "-map",
                  "[vfinal]",
                  "-an",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-pix_fmt",
                  "yuv420p",
                  "-r",
                  "30",
                  f"cena-video-{numero}.mp4"
              ])

              subprocess.run(
                  comando,
                  check=True
              )

          print(
              "Todas as cenas foram montadas."
          )
          PY

