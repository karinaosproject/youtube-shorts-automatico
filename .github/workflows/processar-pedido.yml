name: Processar pedido de Short

on:
  issues:
    types: [opened]

jobs:
  processar:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. PREPARAR AMBIENTE
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar Piper TTS
        run: |
          python -m pip install --upgrade pip
          pip install piper-tts

      # ============================================================
      # 2. LER PEDIDO DO PAINEL
      # ============================================================

      - name: Ler pedido
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os
          import re

          body = os.environ.get("ISSUE_BODY", "")

          def pegar(campo):
              padrao = rf"### {re.escape(campo)}\s*(.*?)(?=\n### |\Z)"
              m = re.search(padrao, body, re.S | re.I)

              if not m:
                  return ""

              return m.group(1).strip()

          tipo = pegar("TIPO DE CONTEÚDO")
          tema = pegar("TEMA")
          duracao = pegar("DURAÇÃO")
          estilo = pegar("ESTILO")
          voz = pegar("VOZ")
          idioma = pegar("IDIOMA")
          visual = pegar("VISUAL")
          referencias = pegar("REFERÊNCIAS")
          intensidade = pegar("INTENSIDADE DAS REFERÊNCIAS")

          if not tipo:
              tipo = "Short"

          if not duracao:
              duracao = "60 segundos"

          if not estilo:
              estilo = "Curiosidades"

          if not voz:
              voz = "Automática"

          if not idioma:
              idioma = "Português brasileiro"

          if not visual:
              visual = "Viral"

          if not referencias:
              referencias = "Nenhuma selecionada"

          if not intensidade:
              intensidade = "Equilibrada"

          with open("pedido.txt", "w", encoding="utf-8") as f:
              f.write(f"TIPO={tipo}\n")
              f.write(f"TEMA={tema}\n")
              f.write(f"DURACAO={duracao}\n")
              f.write(f"ESTILO={estilo}\n")
              f.write(f"VOZ={voz}\n")
              f.write(f"IDIOMA={idioma}\n")
              f.write(f"VISUAL={visual}\n")
              f.write(f"REFERENCIAS={referencias}\n")
              f.write(f"INTENSIDADE={intensidade}\n")

          print("Pedido recebido:")
          print(body)
          PY

      # ============================================================
      # 3. DEFINIR DURAÇÃO E FORMATO
      # ============================================================

      - name: Calcular duração e formato
        run: |
          python - <<'PY'
          import re

          dados = {}

          with open("pedido.txt", encoding="utf-8") as f:
              for linha in f:
                  if "=" in linha:
                      k, v = linha.rstrip("\n").split("=", 1)
                      dados[k] = v

          tipo = dados.get("TIPO", "Short")
          duracao_texto = dados.get(
              "DURACAO",
              "60 segundos"
          ).lower()

          numeros = re.findall(
              r"\d+",
              duracao_texto
          )

          if not numeros:
              duracao = 60
          else:
              numero = int(numeros[0])

              if "hora" in duracao_texto:
                  duracao = numero * 3600
              elif "min" in duracao_texto:
                  duracao = numero * 60
              else:
                  duracao = numero

          duracao = max(
              10,
              min(duracao, 3600)
          )

          if tipo.lower().startswith("short"):
              formato = "short"
              numero_cenas = 6
              largura = 1080
              altura = 1920
          else:
              formato = "long"
              numero_cenas = 12
              largura = 1920
              altura = 1080

          with open("config.txt", "w", encoding="utf-8") as f:
              f.write(f"TIPO={tipo}\n")
              f.write(f"FORMATO={formato}\n")
              f.write(f"DURACAO={duracao}\n")
              f.write(f"CENAS={numero_cenas}\n")
              f.write(f"LARGURA={largura}\n")
              f.write(f"ALTURA={altura}\n")

          print(f"Tipo: {tipo}")
          print(f"Formato: {formato}")
          print(f"Duração: {duracao} segundos")
          print(f"Cenas: {numero_cenas}")
          print(
              f"Resolução: {largura}x{altura}"
          )
          PY

      # ============================================================
      # 4. GERAR ROTEIRO INTELIGENTE COM GEMINI
      # ============================================================

      - name: Gerar roteiro com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          dados = {}

          with open(
              "pedido.txt",
              encoding="utf-8"
          ) as f:

              for linha in f:

                  if "=" in linha:

                      k, v = (
                          linha
                          .rstrip("\n")
                          .split("=", 1)
                      )

                      dados[k] = v

          config = {}

          with open(
              "config.txt",
              encoding="utf-8"
          ) as f:

              for linha in f:

                  if "=" in linha:

                      k, v = (
                          linha
                          .rstrip("\n")
                          .split("=", 1)
                      )

                      config[k] = v

          tipo = dados.get(
              "TIPO",
              "Short"
          )

          tema = dados.get(
              "TEMA",
              ""
          )

          estilo = dados.get(
              "ESTILO",
              "Curiosidades"
          )

          voz = dados.get(
              "VOZ",
              "Automática"
          )

          idioma = dados.get(
              "IDIOMA",
              "Português brasileiro"
          )

          visual = dados.get(
              "VISUAL",
              "Viral"
          )

          referencias = dados.get(
              "REFERENCIAS",
              "Nenhuma selecionada"
          )

          intensidade = dados.get(
              "INTENSIDADE",
              "Equilibrada"
          )

          duracao = int(
              config.get(
                  "DURACAO",
                  "60"
              )
          )

          numero_cenas = int(
              config.get(
                  "CENAS",
                  "6"
              )
          )

          if not tema:
              tema = (
                  "uma curiosidade surpreendente "
                  "sobre animais"
              )

          palavras_aprox = max(
              40,
              int(
                  duracao * 145 / 60
              )
          )

          if tipo.lower().startswith("short"):

              estrutura = """
              O vídeo é um YouTube Short.

              Estrutura:
              1. Gancho muito forte nos primeiros segundos.
              2. Apresentação rápida da curiosidade.
              3. Desenvolvimento direto.
              4. Informação surpreendente.
              5. Fechamento memorável.

              O ritmo deve ser rápido e natural.

              Não transforme a narração em uma lista
              artificial de "número 1", "número 2" etc.,
              a menos que o próprio tema exija isso.
              """

          else:

              estrutura = """
              O vídeo é um vídeo longo do YouTube.

              Ele precisa parecer um documentário curto
              ou uma explicação completa.

              Estrutura recomendada:
              1. Gancho.
              2. Apresentação do assunto.
              3. Contexto.
              4. Desenvolvimento progressivo.
              5. Explicações.
              6. Exemplos.
              7. Comparações quando forem úteis.
              8. Curiosidades relevantes.
              9. Conclusão.
              10. Encerramento natural.

              Não faça simplesmente várias curiosidades
              desconectadas.

              O espectador deve sentir que está aprendendo
              alguma coisa ao longo do vídeo.

              Se o tema for uma lista, use transições
              naturais entre os itens.

              NÃO escreva:
              "Animal número 1"
              "Animal número 2"
              "Curiosidade número 3"

              Prefira transições naturais, como:
              "E é aqui que a história fica ainda mais
              interessante."

              ou simplesmente continue a narrativa sem
              anunciar artificialmente cada item.
              """

          prompt = f"""
          Você é um roteirista profissional de YouTube,
          especializado em vídeos com alta retenção.

          {estrutura}

          TEMA:
          {tema}

          TIPO:
          {tipo}

          DURAÇÃO:
          {duracao} segundos

          ESTILO:
          {estilo}

          VOZ:
          {voz}

          IDIOMA:
          {idioma}

          ESTILO VISUAL:
          {visual}

          REFERÊNCIAS EDITORIAIS:
          {referencias}

          INTENSIDADE DAS REFERÊNCIAS:
          {intensidade}

          As referências são SOMENTE orientação editorial.

          Use delas apenas características gerais de:
          - ritmo
          - estrutura
          - didática
          - linguagem
          - curiosidade
          - narrativa
          - abordagem

          NUNCA copie:
          - frases
          - títulos
          - roteiros
          - textos
          - exemplos específicos
          - sequências identificáveis
          - bordões
          - estrutura característica de um vídeo específico

          O conteúdo final deve ser ORIGINAL.

          IMPORTANTE SOBRE AS CENAS:

          Cada cena precisa representar uma parte real
          da narrativa.

          Cada cena deve possuir entre 2 e 3 sugestões
          visuais diferentes.

          As sugestões visuais devem acompanhar mudanças
          de assunto dentro da narração.

          Não repita exatamente a mesma busca visual.

          As buscas visuais devem ser em INGLÊS,
          curtas e específicas para encontrar vídeos
          no Pexels.

          Evite buscas genéricas como:
          "animal"
          "nature"
          "science"

          Prefira buscas específicas como:
          "blue whale swimming underwater"
          "wolf hunting in forest"
          "close up whale eye"

          LEGENDAS:

          O texto da narração será transformado
          automaticamente em legendas curtas.

          Não escreva legendas longas dentro da narração.

          FATOS:

          Priorize informações corretas.

          Não invente fontes.

          Não invente números muito específicos
          quando não tiver segurança.

          QUANTIDADE EXATA DE CENAS:
          {numero_cenas}

          QUANTIDADE APROXIMADA DE PALAVRAS:
          {palavras_aprox}

          RETORNE SOMENTE JSON VÁLIDO.

          NÃO use markdown.

          FORMATO EXATO:

          {{
            "titulo": "Título do vídeo",
            "descricao": "Descrição do vídeo",
            "hashtags": [
              "#hashtag1",
              "#hashtag2",
              "#hashtag3",
              "#hashtag4",
              "#hashtag5"
            ],
            "cenas": [
              {{
                "numero": 1,
                "narracao": "Texto narrado da cena",
                "visuais": [
                  {{
                    "busca": "visual search in English"
                  }},
                  {{
                    "busca": "another visual search in English"
                  }}
                ]
              }}
            ]
          }}

          REGRAS OBRIGATÓRIAS:

          - Título máximo de 70 caracteres.
          - Exatamente 5 hashtags.
          - Exatamente {numero_cenas} cenas.
          - Cada cena precisa ter narração.
          - Cada cena precisa ter 2 ou 3 visuais.
          - Cada visual precisa ter uma busca.
          - Buscas visuais em inglês.
          - Não use markdown.
          - Não copie outros canais.
          - Não invente fontes.
          - Linguagem natural.
          - Conteúdo original.
          """

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.8,
                  "maxOutputTokens": 16000
              }
          }

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/"
              "gemini-3.1-flash-lite:generateContent"
              "?key="
              + os.environ["GEMINI_API_KEY"]
          )

          req = urllib.request.Request(
              url,
              data=json.dumps(
                  payload
              ).encode("utf-8"),
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:

              with urllib.request.urlopen(
                  req,
                  timeout=180
              ) as response:

                  resultado = json.loads(
                      response
                      .read()
                      .decode("utf-8")
                  )

          except urllib.error.HTTPError as e:

              print(
                  "Erro HTTP do Gemini:",
                  e.code
              )

              print(
                  e.read().decode(
                      "utf-8",
                      errors="ignore"
                  )
              )

              raise

          texto = (
              resultado
              .get("candidates", [{}])[0]
              .get("content", {})
              .get("parts", [{}])[0]
              .get("text", "")
          )

          if not texto:
              raise RuntimeError(
                  "Gemini não retornou texto."
              )

          texto = texto.strip()

          if texto.startswith("```"):
              linhas = texto.splitlines()

              linhas = [
                  linha
                  for linha in linhas
                  if not linha.strip().startswith("```")
              ]

              texto = "\n".join(linhas).strip()

          try:

              dados_json = json.loads(texto)

          except json.JSONDecodeError as e:

              print(
                  "Resposta recebida do Gemini:"
              )

              print(texto)

              raise RuntimeError(
                  "Gemini não retornou JSON válido."
              ) from e

          with open(
              "roteiro-gerado.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  dados_json,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              json.dumps(
                  dados_json,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

      # ============================================================
      # 5. VALIDAR ROTEIRO E CRIAR METADATA
      # ============================================================

      - name: Processar roteiro e metadata
        run: |
          python - <<'PY'
          import json
          import re

          with open(
              "roteiro-gerado.json",
              encoding="utf-8"
          ) as f:

              dados = json.load(f)

          titulo = str(
              dados.get(
                  "titulo",
                  ""
              )
          ).strip()

          descricao = str(
              dados.get(
                  "descricao",
                  ""
              )
          ).strip()

          hashtags = dados.get(
              "hashtags",
              []
          )

          cenas = dados.get(
              "cenas",
              []
          )

          if not titulo:
              raise RuntimeError(
                  "Título não encontrado."
              )

          if not descricao:
              raise RuntimeError(
                  "Descrição não encontrada."
              )

          if not isinstance(
              hashtags,
              list
          ):

              raise RuntimeError(
                  "Hashtags precisam ser uma lista."
              )

          hashtags = [
              str(x).strip()
              for x in hashtags
              if str(x).strip()
          ]

          hashtags = [
              x if x.startswith("#")
              else "#" + x
              for x in hashtags
          ]

          hashtags = hashtags[:5]

          if len(hashtags) != 5:
              raise RuntimeError(
                  "Era necessário exatamente "
                  "5 hashtags."
              )

          if len(titulo) > 70:
              titulo = titulo[:70].rstrip()

          config = {}

          with open(
              "config.txt",
              encoding="utf-8"
          ) as f:

              for linha in f:

                  if "=" in linha:

                      k, v = (
                          linha
                          .rstrip("\n")
                          .split("=", 1)
                      )

                      config[k] = v

          numero_cenas = int(
              config.get(
                  "CENAS",
                  "6"
              )
          )

          if not isinstance(
              cenas,
              list
          ):

              raise RuntimeError(
                  "Cenas precisam ser uma lista."
              )

          if len(cenas) != numero_cenas:

              raise RuntimeError(
                  f"Esperadas {numero_cenas} cenas, "
                  f"mas Gemini retornou "
                  f"{len(cenas)}."
              )

          cenas_finais = []

          for indice, cena in enumerate(
              cenas,
              start=1
          ):

              numero = int(
                  cena.get(
                      "numero",
                      indice
                  )
              )

              narracao = str(
                  cena.get(
                      "narracao",
                      ""
                  )
              ).strip()

              visuais = cena.get(
                  "visuais",
                  []
              )

              if not narracao:
                  raise RuntimeError(
                      f"Cena {numero} sem narração."
                  )

              if not isinstance(
                  visuais,
                  list
              ):

                  raise RuntimeError(
                      f"Cena {numero} sem visuais."
                  )

              visuais_finais = []

              for visual in visuais:

                  busca = str(
                      visual.get(
                          "busca",
                          ""
                      )
                  ).strip()

                  if busca:
                      visuais_finais.append(
                          {
                              "busca": busca
                          }
                      )

              if len(visuais_finais) < 2:

                  raise RuntimeError(
                      f"Cena {numero} precisa "
                      f"de pelo menos 2 visuais."
                  )

              visuais_finais = (
                  visuais_finais[:3]
              )

              cenas_finais.append(
                  {
                      "numero": numero,
                      "texto": narracao,
                      "visuais": visuais_finais
                  }
              )

          cenas_finais.sort(
              key=lambda x: x["numero"]
          )

          with open(
              "cenas.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  cenas_finais,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          tipo = config.get(
              "TIPO",
              "Short"
          )

          duracao = int(
              config.get(
                  "DURACAO",
                  "60"
              )
          )

          with open(
              "youtube-metadata.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  {
                      "titulo": titulo,
                      "descricao": descricao,
                      "hashtags": hashtags,
                      "tipo": tipo,
                      "duracao_segundos": duracao
                  },
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              "roteiro.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  titulo + "\n\n"
              )

              f.write(
                  descricao + "\n\n"
              )

              f.write(
                  " ".join(hashtags)
                  + "\n\n"
              )

              for cena in cenas_finais:

                  f.write(
                      f"CENA {cena['numero']}\n"
                  )

                  f.write(
                      "TEXTO: "
                      + cena["texto"]
                      + "\n"
                  )

                  for visual in cena["visuais"]:

                      f.write(
                          "BUSCA: "
                          + visual["busca"]
                          + "\n"
                      )

                  f.write("\n")

          print(
              "Título:",
              titulo
          )

          print(
              "Hashtags:",
              hashtags
          )

          print(
              "Cenas:",
              len(cenas_finais)
          )

          for cena in cenas_finais:

              print(
                  f"Cena {cena['numero']}: "
                  f"{len(cena['visuais'])} visuais"
              )
          PY

      # ============================================================
      # 6. BAIXAR VOZ PIPER
      # ============================================================

      - name: Baixar voz Piper
        run: |
          mkdir -p voz

          wget -q \
            -O voz/pt_BR-faber-medium.onnx \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx

          wget -q \
            -O voz/pt_BR-faber-medium.onnx.json \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx.json

          ls -lh voz/

      # ============================================================
      # 7. GERAR NARRAÇÕES
      # ============================================================

      - name: Gerar narrações
        run: |
          mkdir -p audios

          python - <<'PY'
          import json
          import subprocess

          with open(
              "cenas.json",
              encoding="utf-8"
          ) as f:

              cenas = json.load(f)

          for cena in cenas:

              numero = cena["numero"]
              texto = cena["texto"]

              arquivo_txt = (
                  f"cena_{numero}.txt"
              )

              arquivo_audio = (
                  f"audios/cena_{numero}.wav"
              )

              with open(
                  arquivo_txt,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(texto)

              comando = [
                  "piper",
                  "--model",
                  "voz/pt_BR-faber-medium.onnx",
                  "--config",
                  "voz/pt_BR-faber-medium.onnx.json",
                  "--input_file",
                  arquivo_txt,
                  "--output_file",
                  arquivo_audio
              ]

              subprocess.run(
                  comando,
                  check=True
              )

              print(
                  f"Áudio da cena {numero} criado."
              )
          PY

          ls -lh audios/

      # ============================================================
      # 8. BUSCAR MÚLTIPLOS VÍDEOS NO PEXELS
      # ============================================================

      - name: Buscar vídeos no Pexels
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          mkdir -p videos

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import time

          with open(
              "cenas.json",
              encoding="utf-8"
          ) as f:

              cenas = json.load(f)

          config = {}

          with open(
              "config.txt",
              encoding="utf-8"
          ) as f:

              for linha in f:

                  if "=" in linha:

                      k, v = (
                          linha
                          .rstrip("\n")
                          .split("=", 1)
                      )

                      config[k] = v

          formato = config.get(
              "FORMATO",
              "short"
          )

          api_key = os.environ[
              "PEXELS_API_KEY"
          ]

          usados = set()
          creditos = []

          def proporcao_alvo():
              if formato == "short":
                  return 9 / 16
              return 16 / 9

          def escolher_arquivo(arquivos):

              alvo = proporcao_alvo()

              validos = [
                  x
                  for x in arquivos
                  if x.get("link")
              ]

              def diferenca(item):

                  largura = item.get(
                      "width",
                      1080
                  )

                  altura = max(
                      item.get(
                          "height",
                          1920
                      ),
                      1
                  )

                  proporcao = (
                      largura / altura
                  )

                  return abs(
                      proporcao - alvo
                  )

              validos.sort(
                  key=diferenca
              )

              return (
                  validos[0]
                  if validos
                  else None
              )

          for cena in cenas:

              numero = cena["numero"]

              visuais = cena["visuais"]

              for visual_index, visual in enumerate(
                  visuais,
                  start=1
              ):

                  busca = visual["busca"]

                  orientacao = (
                      "portrait"
                      if formato == "short"
                      else "landscape"
                  )

                  params = urllib.parse.urlencode(
                      {
                          "query": busca,
                          "orientation": orientacao,
                          "size": "medium",
                          "per_page": 20
                      }
                  )

                  url = (
                      "https://api.pexels.com/videos/search?"
                      + params
                  )

                  print(
                      f"Cena {numero} "
                      f"Visual {visual_index}: "
                      f"{busca}"
                  )

                  req = urllib.request.Request(
                      url,
                      headers={
                          "Authorization": api_key,
                          "User-Agent": "Mozilla/5.0"
                      }
                  )

                  with urllib.request.urlopen(
                      req,
                      timeout=60
                  ) as response:

                      dados = json.loads(
                          response
                          .read()
                          .decode("utf-8")
                      )

                  resultados = dados.get(
                      "videos",
                      []
                  )

                  escolhido = None

                  for video in resultados:

                      video_id = video.get(
                          "id"
                      )

                      if video_id in usados:
                          continue

                      arquivo = escolher_arquivo(
                          video.get(
                              "video_files",
                              []
                          )
                      )

                      if not arquivo:
                          continue

                      escolhido = (
                          video,
                          arquivo
                      )

                      break

                  if not escolhido:

                      raise RuntimeError(
                          "Nenhum vídeo único encontrado "
                          f"para cena {numero}, "
                          f"visual {visual_index}."
                      )

                  video, arquivo = escolhido

                  usados.add(
                      video["id"]
                  )

                  caminho = (
                      f"videos/"
                      f"cena_{numero}_visual_"
                      f"{visual_index}.mp4"
                  )

                  req_video = urllib.request.Request(
                      arquivo["link"],
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      }
                  )

                  with urllib.request.urlopen(
                      req_video,
                      timeout=120
                  ) as response, open(
                      caminho,
                      "wb"
                  ) as out:

                      while True:

                          bloco = response.read(
                              1024 * 1024
                          )

                          if not bloco:
                              break

                          out.write(bloco)

                  creditos.append(
                      f"Cena {numero} "
                      f"Visual {visual_index}: "
                      f"https://www.pexels.com/video/"
                      f"{video['id']}/"
                  )

                  time.sleep(0.5)

          with open(
              "pexels-credit.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "Vídeos utilizados via Pexels:\n\n"
              )

              f.write(
                  "\n".join(creditos)
              )

          print(
              "Todos os vídeos visuais foram baixados."
          )
          PY

