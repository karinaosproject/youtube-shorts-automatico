name: Processar pedido de Short

on:
  issues:
    types: [opened]

jobs:
  criar-short:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. INSTALAR FERRAMENTAS
      # =========================================================

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar Piper TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install piper-tts

      # =========================================================
      # 2. LER PEDIDO
      # =========================================================

      - name: Ler pedido
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          echo "================================"
          echo "🎬 NOVO PEDIDO DE SHORT"
          echo "================================"
          echo "Título:"
          echo "$ISSUE_TITLE"
          echo ""
          echo "Pedido:"
          echo "$ISSUE_BODY"
          echo "================================"

      # =========================================================
      # 3. GEMINI
      #
      # UMA ÚNICA CHAMADA
      #
      # Gera:
      # - roteiro dividido em 6 cenas
      # - busca visual para cada cena
      # =========================================================

      - name: Gerar roteiro e cenas com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          api_key = os.environ["GEMINI_API_KEY"].strip()
          pedido = os.environ["ISSUE_BODY"]

          if not api_key:
              raise Exception("GEMINI_API_KEY não foi encontrada.")

          prompt = f"""
          Você é um roteirista profissional de YouTube Shorts.

          Crie um Short em português brasileiro baseado no pedido abaixo.

          O roteiro deve ter aproximadamente 30 a 60 segundos.

          DIVIDA o roteiro em EXATAMENTE 6 cenas.

          Cada cena deve conter:
          - texto que será narrado naquela cena
          - uma busca curta em inglês para encontrar um vídeo
            visualmente relacionado no Pexels.

          REGRAS:
          - Comece com um gancho forte.
          - Frases curtas.
          - Ritmo rápido.
          - Informações interessantes.
          - Não use introdução desnecessária.
          - Termine com uma frase de impacto.
          - Cada cena deve representar uma parte diferente da história.
          - As buscas devem ser visuais e concretas.
          - Use de 1 a 4 palavras em cada busca.
          - Evite buscas abstratas.
          - Não repita a mesma busca.
          - Não coloque título dentro dos textos.
          - Não coloque explicações fora do JSON.

          PEDIDO:
          {pedido}

          Responda SOMENTE com JSON válido neste formato:

          {{
            "cenas": [
              {{
                "texto": "texto da primeira cena",
                "busca": "english visual search"
              }},
              {{
                "texto": "texto da segunda cena",
                "busca": "english visual search"
              }},
              {{
                "texto": "texto da terceira cena",
                "busca": "english visual search"
              }},
              {{
                "texto": "texto da quarta cena",
                "busca": "english visual search"
              }},
              {{
                "texto": "texto da quinta cena",
                "busca": "english visual search"
              }},
              {{
                "texto": "texto da sexta cena",
                "busca": "english visual search"
              }}
            ]
          }}
          """

          data = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "responseMimeType": "application/json"
              }
          }

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-3.1-flash-lite:generateContent"
          )

          request = urllib.request.Request(
              url,
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": api_key,
                  "User-Agent": "youtube-shorts-automatico/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=180
              ) as response:
                  resultado = json.load(response)

          except urllib.error.HTTPError as e:
              print("❌ ERRO DA API GEMINI")
              print("Código:", e.code)
              print(e.read().decode("utf-8"))
              raise

          texto = (
              resultado["candidates"][0]
              ["content"]["parts"][0]["text"]
          )

          dados = json.loads(texto)

          cenas = dados.get("cenas", [])

          if len(cenas) != 6:
              raise Exception(
                  f"Gemini retornou {len(cenas)} cenas. "
                  "Esperadas exatamente 6."
              )

          for i, cena in enumerate(cenas, start=1):

              if not cena.get("texto"):
                  raise Exception(
                      f"Cena {i} não possui texto."
                  )

              if not cena.get("busca"):
                  raise Exception(
                      f"Cena {i} não possui busca."
                  )

          with open(
              "cenas.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  cenas,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              "roteiro.txt",
              "w",
              encoding="utf-8"
          ) as f:

              for cena in cenas:
                  f.write(
                      cena["texto"].strip()
                      + "\n\n"
                  )

          print("================================")
          print("🧠 6 CENAS GERADAS")
          print("================================")

          for i, cena in enumerate(cenas, start=1):
              print("")
              print(f"CENA {i}")
              print("Texto:", cena["texto"])
              print("Busca:", cena["busca"])

          print("================================")
          PY

      # =========================================================
      # 4. BAIXAR VOZ PIPER
      # =========================================================

      - name: Baixar voz Piper PT-BR
        run: |
          mkdir -p models

          wget -q --show-progress \
            -O models/pt_BR-faber-medium.onnx \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx"

          wget -q --show-progress \
            -O models/pt_BR-faber-medium.onnx.json \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx.json"

          test -s models/pt_BR-faber-medium.onnx
          test -s models/pt_BR-faber-medium.onnx.json

          echo "✅ Modelo Piper pronto."

      # =========================================================
      # 5. GERAR UMA NARRAÇÃO PARA CADA CENA
      #
      # Isso permite sincronizar cada vídeo com sua fala.
      # =========================================================

      - name: Gerar narrações das cenas
        run: |
          python - <<'PY'
          import json
          import subprocess
          import os

          with open(
              "cenas.json",
              "r",
              encoding="utf-8"
          ) as f:
              cenas = json.load(f)

          os.makedirs("audios", exist_ok=True)

          for i, cena in enumerate(cenas, start=1):

              texto = cena["texto"].strip()

              arquivo = (
                  f"audios/cena-{i:02d}.wav"
              )

              print("")
              print("🎙️ Gerando:", arquivo)

              processo = subprocess.run(
                  [
                      "python",
                      "-m",
                      "piper",
                      "--model",
                      "models/pt_BR-faber-medium.onnx",
                      "--output_file",
                      arquivo
                  ],
                  input=texto,
                  text=True
              )

              if processo.returncode != 0:
                  raise Exception(
                      f"Piper falhou na cena {i}."
                  )

              if not os.path.exists(arquivo):
                  raise Exception(
                      f"Áudio da cena {i} não foi criado."
                  )

          print("")
          print("================================")
          print("🎙️ TODAS AS NARRAÇÕES PRONTAS")
          print("================================")
          PY

      # =========================================================
      # 6. BUSCAR 6 VÍDEOS NO PEXELS
      # =========================================================

      - name: Buscar vídeos no Pexels
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import urllib.parse
          import time

          api_key = os.environ.get(
              "PEXELS_API_KEY",
              ""
          ).strip()

          if not api_key:
              raise Exception(
                  "PEXELS_API_KEY não foi encontrada."
              )

          with open(
              "cenas.json",
              "r",
              encoding="utf-8"
          ) as f:
              cenas = json.load(f)

          os.makedirs("videos", exist_ok=True)

          user_agent = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/120.0 Safari/537.36"
          )

          usados = set()

          for indice, cena in enumerate(
              cenas,
              start=1
          ):

              busca = cena["busca"].strip()

              print("")
              print("================================")
              print(f"🎞️ CENA {indice}/6")
              print("================================")
              print("Busca:", busca)

              params = urllib.parse.urlencode({
                  "query": busca,
                  "orientation": "portrait",
                  "size": "medium",
                  "per_page": 20
              })

              url = (
                  "https://api.pexels.com/v1/videos/search?"
                  + params
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": api_key,
                      "User-Agent": user_agent,
                      "Accept": "application/json"
                  },
                  method="GET"
              )

              resultado = None

              for tentativa in range(1, 4):

                  try:

                      print(
                          f"📡 Tentativa {tentativa}/3"
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=60
                      ) as response:

                          resultado = json.load(
                              response
                          )

                      break

                  except urllib.error.HTTPError as e:

                      corpo = e.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      print(
                          "⚠️ Erro HTTP:",
                          e.code
                      )
                      print(corpo)

                      if e.code == 429:
                          time.sleep(10)
                          continue

                      raise

              if resultado is None:
                  raise Exception(
                      f"Pexels não respondeu para cena {indice}."
                  )

              videos = resultado.get(
                  "videos",
                  []
              )

              if not videos:
                  raise Exception(
                      f"Nenhum vídeo encontrado para: {busca}"
                  )

              escolhido = None

              # -------------------------------------------------
              # Procurar vídeo vertical que ainda não foi usado
              # -------------------------------------------------

              for video in videos:

                  video_id = video.get("id")

                  if video_id in usados:
                      continue

                  for arquivo in video.get(
                      "video_files",
                      []
                  ):

                      largura = arquivo.get(
                          "width",
                          0
                      )

                      altura = arquivo.get(
                          "height",
                          0
                      )

                      link = arquivo.get(
                          "link"
                      )

                      if (
                          link
                          and altura
                          and largura
                          and altura > largura
                      ):

                          escolhido = {
                              "id": video_id,
                              "page": video.get("url"),
                              "link": link
                          }

                          break

                  if escolhido:
                      break

              # -------------------------------------------------
              # Fallback: qualquer vídeo
              # -------------------------------------------------

              if not escolhido:

                  for video in videos:

                      video_id = video.get("id")

                      if video_id in usados:
                          continue

                      for arquivo in video.get(
                          "video_files",
                          []
                      ):

                          link = arquivo.get(
                              "link"
                          )

                          if link:

                              escolhido = {
                                  "id": video_id,
                                  "page": video.get("url"),
                                  "link": link
                              }

                              break

                      if escolhido:
                          break

              if not escolhido:
                  raise Exception(
                      f"Não foi possível escolher "
                      f"vídeo para cena {indice}."
                  )

              usados.add(
                  escolhido["id"]
              )

              print(
                  "✅ Vídeo escolhido:",
                  escolhido["id"]
              )

              # -------------------------------------------------
              # Download
              # -------------------------------------------------

              download_request = urllib.request.Request(
                  escolhido["link"],
                  headers={
                      "User-Agent": user_agent,
                      "Accept": "*/*"
                  },
                  method="GET"
              )

              arquivo_saida = (
                  f"videos/cena-{indice:02d}.mp4"
              )

              with urllib.request.urlopen(
                  download_request,
                  timeout=180
              ) as response:

                  with open(
                      arquivo_saida,
                      "wb"
                  ) as f:

                      while True:

                          bloco = response.read(
                              1024 * 1024
                          )

                          if not bloco:
                              break

                          f.write(bloco)

              if not os.path.getsize(
                  arquivo_saida
              ):
                  raise Exception(
                      f"Vídeo vazio na cena {indice}."
                  )

              cena["pexels_id"] = escolhido["id"]
              cena["pexels_page"] = escolhido["page"]

              print(
                  "✅ Download concluído."
              )

          with open(
              "cenas.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  cenas,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("================================")
          print("🎞️ 6 VÍDEOS BAIXADOS")
          print("================================")
          PY

      # =========================================================
      # 7. PREPARAR DURAÇÃO DE CADA CENA
      # =========================================================

      - name: Preparar clipes sincronizados
        run: |
          mkdir -p clips

          for i in 01 02 03 04 05 06
          do

            echo "================================"
            echo "🎬 Preparando cena $i"
            echo "================================"

            DURACAO=$(ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "audios/cena-$i.wav")

            echo "Duração da narração: $DURACAO segundos"

            ffmpeg \
              -y \
              -stream_loop -1 \
              -i "videos/cena-$i.mp4" \
              -t "$DURACAO" \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1" \
              -an \
              -c:v libx264 \
              -preset veryfast \
              -crf 23 \
              -pix_fmt yuv420p \
              "clips/cena-$i.mp4"

          done

          echo "================================"
          echo "✅ CLIPES PREPARADOS"
          echo "================================"

      # =========================================================
      # 8. CRIAR LISTA DOS VÍDEOS
      # =========================================================

      - name: Criar lista de montagem
        run: |
          rm -f lista-videos.txt
          rm -f lista-audios.txt

          for i in 01 02 03 04 05 06
          do
            echo "file '$(pwd)/clips/cena-$i.mp4'" >> lista-videos.txt
            echo "file '$(pwd)/audios/cena-$i.wav'" >> lista-audios.txt
          done

          cat lista-videos.txt
          echo ""
          cat lista-audios.txt

      # =========================================================
      # 9. JUNTAR OS VÍDEOS
      # =========================================================

      - name: Juntar vídeos
        run: |
          ffmpeg \
            -y \
            -f concat \
            -safe 0 \
            -i lista-videos.txt \
            -c copy \
            video-completo.mp4

          test -s video-completo.mp4

      # =========================================================
      # 10. JUNTAR AS NARRAÇÕES
      # =========================================================

      - name: Juntar narrações
        run: |
          ffmpeg \
            -y \
            -f concat \
            -safe 0 \
            -i lista-audios.txt \
            -c:a pcm_s16le \
            narracao-completa.wav

          test -s narracao-completa.wav

      # =========================================================
      # 11. JUNTAR VÍDEO + NARRAÇÃO
      # =========================================================

      - name: Criar Short final
        run: |
          echo "================================"
          echo "🎬 CRIANDO SHORT FINAL"
          echo "================================"

          ffmpeg \
            -y \
            -i video-completo.mp4 \
            -i narracao-completa.wav \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v copy \
            -c:a aac \
            -b:a 128k \
            -shortest \
            -movflags +faststart \
            short-final.mp4

          test -s short-final.mp4

          echo "================================"
          echo "✅ SHORT FINAL CRIADO"
          echo "================================"

          ls -lh short-final.mp4

      # =========================================================
      # 12. CRÉDITOS PEXELS
      # =========================================================

      - name: Criar créditos Pexels
        run: |
          python - <<'PY'
          import json

          with open(
              "cenas.json",
              "r",
              encoding="utf-8"
          ) as f:
              cenas = json.load(f)

          with open(
              "pexels-credit.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "Vídeos utilizados neste Short:\n\n"
              )

              f.write(
                  "Conteúdo fornecido por Pexels:\n"
              )

              f.write(
                  "https://www.pexels.com/\n\n"
              )

              for i, cena in enumerate(
                  cenas,
                  start=1
              ):

                  f.write(
                      f"Cena {i} - "
                      f"Pexels ID: "
                      f"{cena.get('pexels_id', '')}\n"
                  )

                  pagina = cena.get(
                      "pexels_page"
                  )

                  if pagina:
                      f.write(
                          pagina + "\n"
                      )

                  f.write("\n")

          print(
              "✅ Créditos Pexels criados."
          )

      # =========================================================
      # 13. VERIFICAR RESULTADO
      # =========================================================

      - name: Verificar Short
        run: |
          echo "================================"
          echo "🔍 VERIFICANDO RESULTADO"
          echo "================================"

          ffprobe \
            -v error \
            -show_entries \
            stream=codec_type,codec_name,width,height \
            -show_entries \
            format=duration \
            -of default=noprint_wrappers=1 \
            short-final.mp4

          echo "================================"
          echo "✅ SHORT VALIDADO"
          echo "================================"

      # =========================================================
      # 14. SALVAR ARQUIVOS
      # =========================================================

      - name: Salvar arquivos gerados
        uses: actions/upload-artifact@v4
        with:
          name: short-gerado
          path: |
            short-final.mp4
            roteiro.txt
            cenas.json
            narracao-completa.wav
            pexels-credit.txt
            videos/
            clips/
