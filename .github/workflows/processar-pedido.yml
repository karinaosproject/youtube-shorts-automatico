name: Processar pedido de Short

on:
  issues:
    types: [opened]

jobs:
  processar:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. PREPARAR AMBIENTE
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar Piper TTS
        run: |
          python -m pip install --upgrade pip
          pip install piper-tts

      # ============================================================
      # 2. LER PEDIDO
      # ============================================================

      - name: Ler pedido
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os
          import re

          body = os.environ.get("ISSUE_BODY", "")

          def pegar(campo):
              padrao = rf"### {re.escape(campo)}\s*(.*?)(?=\n### |\Z)"
              m = re.search(padrao, body, re.S | re.I)

              if not m:
                  return ""

              return m.group(1).strip()

          tipo = pegar("TIPO DE CONTEÚDO")
          tema = pegar("TEMA")
          duracao = pegar("DURAÇÃO")
          estilo = pegar("ESTILO")
          voz = pegar("VOZ")
          idioma = pegar("IDIOMA")
          visual = pegar("VISUAL")
          referencias = pegar("REFERÊNCIAS")

          if not tipo:
              tipo = "Short"

          if not duracao:
              duracao = "60 segundos"

          if not estilo:
              estilo = "Curiosidades"

          if not voz:
              voz = "Automática"

          if not idioma:
              idioma = "Português brasileiro"

          if not visual:
              visual = "Viral"

          if not referencias:
              referencias = "Nenhuma selecionada"

          with open("pedido.txt", "w", encoding="utf-8") as f:
              f.write(f"TIPO={tipo}\n")
              f.write(f"TEMA={tema}\n")
              f.write(f"DURACAO={duracao}\n")
              f.write(f"ESTILO={estilo}\n")
              f.write(f"VOZ={voz}\n")
              f.write(f"IDIOMA={idioma}\n")
              f.write(f"VISUAL={visual}\n")
              f.write(f"REFERENCIAS={referencias}\n")

          print("Pedido recebido:")
          print(body)
          PY

      # ============================================================
      # 3. DEFINIR FORMATO E DURAÇÃO
      # ============================================================

      - name: Calcular duração e formato
        run: |
          python - <<'PY'
          import re

          dados = {}

          with open("pedido.txt", encoding="utf-8") as f:
              for linha in f:
                  if "=" in linha:
                      k, v = linha.rstrip("\n").split("=", 1)
                      dados[k] = v

          tipo = dados.get("TIPO", "Short")
          duracao_texto = dados.get("DURACAO", "60 segundos").lower()

          numeros = re.findall(r"\d+", duracao_texto)

          if not numeros:
              duracao = 60
          else:
              numero = int(numeros[0])

              if "hora" in duracao_texto:
                  duracao = numero * 3600

              elif "min" in duracao_texto:
                  duracao = numero * 60

              else:
                  duracao = numero

          duracao = max(10, min(duracao, 3600))

          if tipo.lower().startswith("short"):

              formato = "short"
              numero_cenas = 6

              largura = 1080
              altura = 1920

          else:

              formato = "long"
              numero_cenas = 12

              largura = 1920
              altura = 1080

          with open("config.txt", "w", encoding="utf-8") as f:
              f.write(f"TIPO={tipo}\n")
              f.write(f"FORMATO={formato}\n")
              f.write(f"DURACAO={duracao}\n")
              f.write(f"CENAS={numero_cenas}\n")
              f.write(f"LARGURA={largura}\n")
              f.write(f"ALTURA={altura}\n")

          print(f"Tipo: {tipo}")
          print(f"Formato: {formato}")
          print(f"Duração: {duracao} segundos")
          print(f"Cenas: {numero_cenas}")
          print(f"Resolução: {largura}x{altura}")
          PY

      # ============================================================
      # 4. GERAR ROTEIRO COM GEMINI
      # ============================================================

      - name: Gerar roteiro com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          dados = {}

          with open("pedido.txt", encoding="utf-8") as f:
              for linha in f:
                  if "=" in linha:
                      k, v = linha.rstrip("\n").split("=", 1)
                      dados[k] = v

          config = {}

          with open("config.txt", encoding="utf-8") as f:
              for linha in f:
                  if "=" in linha:
                      k, v = linha.rstrip("\n").split("=", 1)
                      config[k] = v

          tipo = dados.get("TIPO", "Short")
          tema = dados.get("TEMA", "")
          estilo = dados.get("ESTILO", "Curiosidades")
          voz = dados.get("VOZ", "Automática")
          idioma = dados.get("IDIOMA", "Português brasileiro")
          visual = dados.get("VISUAL", "Viral")
          referencias = dados.get(
              "REFERENCIAS",
              "Nenhuma selecionada"
          )

          duracao = int(
              config.get("DURACAO", "60")
          )

          numero_cenas = int(
              config.get("CENAS", "6")
          )

          if not tema:
              tema = "uma curiosidade surpreendente sobre animais"

          if tipo.lower().startswith("short"):

              tipo_instrucao = """
              Crie um roteiro para YouTube Shorts.
              O conteúdo deve ser extremamente dinâmico,
              direto e prender a atenção imediatamente.
              """

          else:

              tipo_instrucao = """
              Crie um roteiro para um vídeo longo do YouTube.
              O conteúdo deve ter desenvolvimento progressivo,
              contexto, explicações, curiosidades e conclusão.
              O roteiro deve parecer um vídeo completo,
              não uma sequência de Shorts.
              """

          palavras_aprox = max(
              40,
              int(duracao * 145 / 60)
          )

          prompt = f"""
          Você é roteirista profissional de conteúdo para YouTube.

          {tipo_instrucao}

          TEMA:
          {tema}

          TIPO:
          {tipo}

          DURAÇÃO ALVO:
          {duracao} segundos

          ESTILO:
          {estilo}

          VOZ:
          {voz}

          IDIOMA:
          {idioma}

          ESTILO VISUAL:
          {visual}

          REFERÊNCIAS:
          {referencias}

          As referências servem SOMENTE como inspiração
          de estilo, estrutura, ritmo e abordagem.

          NÃO copie textos, frases, títulos, roteiros ou
          estruturas específicas desses canais.

          O conteúdo precisa ser original.

          Velocidade aproximada da narração:
          145 palavras por minuto.

          Quantidade EXATA de cenas:
          {numero_cenas}

          Gere aproximadamente:
          {palavras_aprox} palavras.

          Para vídeo longo, desenvolva o assunto de forma
          progressiva e natural.

          Para Short, priorize gancho, ritmo e retenção.

          Cada cena deve possuir uma narração própria.

          Para cada cena informe também uma BUSCA visual
          curta, em inglês, adequada para procurar vídeos
          no Pexels.

          FORMATO OBRIGATÓRIO:

          TITULO: título do vídeo

          DESCRICAO: descrição do vídeo

          HASHTAGS: #hashtag1 #hashtag2 #hashtag3 #hashtag4 #hashtag5

          CENA 1
          TEXTO: texto da cena
          BUSCA: visual search in English

          CENA 2
          TEXTO: texto da cena
          BUSCA: visual search in English

          ...

          CENA {numero_cenas}
          TEXTO: texto da cena
          BUSCA: visual search in English

          REGRAS:

          - Título com no máximo 70 caracteres.
          - Exatamente 5 hashtags.
          - Exatamente {numero_cenas} cenas.
          - Cada cena precisa ter TEXTO e BUSCA.
          - Não use markdown.
          - Não copie conteúdo de outros canais.
          - Não invente fontes.
          - Priorize fatos corretos.
          - Use linguagem natural.
          - Não escreva explicações fora do formato solicitado.
          """

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.8,
                  "maxOutputTokens": 16000
              }
          }

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-3.1-flash-lite:generateContent"
              "?key=" +
              os.environ["GEMINI_API_KEY"]
          )

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:

              with urllib.request.urlopen(
                  req,
                  timeout=180
              ) as response:

                  resultado = json.loads(
                      response.read().decode("utf-8")
                  )

          except urllib.error.HTTPError as e:

              print(
                  "Erro HTTP do Gemini:",
                  e.code
              )

              print(
                  e.read().decode(
                      "utf-8",
                      errors="ignore"
                  )
              )

              raise

          texto = (
              resultado
              .get("candidates", [{}])[0]
              .get("content", {})
              .get("parts", [{}])[0]
              .get("text", "")
          )

          if not texto:
              raise RuntimeError(
                  "Gemini não retornou texto."
              )

          with open(
              "roteiro-gerado.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(texto)

          print(texto)
          PY

      # ============================================================
      # 5. PROCESSAR ROTEIRO + METADATA
      # ============================================================

      - name: Processar roteiro e metadata
        run: |
          python - <<'PY'
          import json
          import re

          with open(
              "roteiro-gerado.txt",
              encoding="utf-8"
          ) as f:

              texto = f.read().strip()

          titulo_match = re.search(
              r"TITULO:\s*(.+)",
              texto,
              re.I
          )

          descricao_match = re.search(
              r"DESCRICAO:\s*(.*?)(?=\nHASHTAGS:|\Z)",
              texto,
              re.I | re.S
          )

          hashtags_match = re.search(
              r"HASHTAGS:\s*(.+)",
              texto,
              re.I
          )

          if not titulo_match:
              raise RuntimeError(
                  "Título não encontrado."
              )

          if not descricao_match:
              raise RuntimeError(
                  "Descrição não encontrada."
              )

          if not hashtags_match:
              raise RuntimeError(
                  "Hashtags não encontradas."
              )

          titulo = titulo_match.group(1).strip()

          descricao = (
              descricao_match
              .group(1)
              .strip()
          )

          hashtags_texto = (
              hashtags_match
              .group(1)
              .strip()
          )

          if len(titulo) > 70:
              titulo = titulo[:70].rstrip()

          lista_hashtags = re.findall(
              r"#[A-Za-zÀ-ÿ0-9_]+",
              hashtags_texto
          )

          lista_hashtags = lista_hashtags[:5]

          if len(lista_hashtags) != 5:
              raise RuntimeError(
                  "Era necessário exatamente "
                  "5 hashtags. Foram encontradas "
                  f"{len(lista_hashtags)}."
              )

          cenas = []

          padrao_cena = re.compile(
              r"CENA\s+(\d+)\s*"
              r"TEXTO:\s*(.*?)\s*"
              r"BUSCA:\s*(.*?)(?=\nCENA\s+\d+|\Z)",
              re.I | re.S
          )

          for m in padrao_cena.finditer(texto):

              numero = int(
                  m.group(1)
              )

              texto_cena = (
                  m.group(2)
                  .strip()
              )

              busca = (
                  m.group(3)
                  .strip()
              )

              texto_cena = re.sub(
                  r"\s+",
                  " ",
                  texto_cena
              )

              busca = re.sub(
                  r"\s+",
                  " ",
                  busca
              )

              if texto_cena and busca:

                  cenas.append(
                      {
                          "numero": numero,
                          "texto": texto_cena,
                          "busca": busca
                      }
                  )

          config = {}

          with open(
              "config.txt",
              encoding="utf-8"
          ) as f:

              for linha in f:

                  if "=" in linha:

                      k, v = (
                          linha
                          .rstrip("\n")
                          .split("=", 1)
                      )

                      config[k] = v

          numero_cenas = int(
              config.get("CENAS", "6")
          )

          if len(cenas) != numero_cenas:

              raise RuntimeError(
                  f"Esperadas {numero_cenas} cenas, "
                  f"mas foram encontradas "
                  f"{len(cenas)}."
              )

          cenas.sort(
              key=lambda x: x["numero"]
          )

          with open(
              "cenas.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  cenas,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ========================================================
          # IMPORTANTE:
          # HASHTAGS É UMA LISTA.
          # ========================================================

          with open(
              "youtube-metadata.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  {
                      "titulo": titulo,
                      "descricao": descricao,
                      "hashtags": lista_hashtags,
                      "tipo": config.get(
                          "TIPO",
                          "Short"
                      ),
                      "duracao_segundos": int(
                          config.get(
                              "DURACAO",
                              "60"
                          )
                      )
                  },
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              "roteiro.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  titulo + "\n\n"
              )

              f.write(
                  descricao + "\n\n"
              )

              f.write(
                  " ".join(lista_hashtags)
                  + "\n\n"
              )

              for cena in cenas:

                  f.write(
                      f"CENA {cena['numero']}\n"
                  )

                  f.write(
                      f"TEXTO: {cena['texto']}\n"
                  )

                  f.write(
                      f"BUSCA: {cena['busca']}\n\n"
                  )

          print(
              "Título:",
              titulo
          )

          print(
              "Descrição:",
              descricao
          )

          print(
              "Hashtags:",
              lista_hashtags
          )

          print(
              "Cenas:",
              len(cenas)
          )
          PY

      # ============================================================
      # 6. BAIXAR VOZ PIPER
      # ============================================================

      - name: Baixar voz Piper
        run: |
          mkdir -p voz

          wget -q \
            -O voz/pt_BR-faber-medium.onnx \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx

          wget -q \
            -O voz/pt_BR-faber-medium.onnx.json \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx.json

          ls -lh voz/

      # ============================================================
      # 7. GERAR NARRAÇÕES
      # ============================================================

      - name: Gerar narrações
        run: |
          mkdir -p audios

          python - <<'PY'
          import json
          import subprocess

          with open(
              "cenas.json",
              encoding="utf-8"
          ) as f:

              cenas = json.load(f)

          for cena in cenas:

              numero = cena["numero"]
              texto = cena["texto"]

              arquivo_txt = (
                  f"cena_{numero}.txt"
              )

              arquivo_audio = (
                  f"audios/cena_{numero}.wav"
              )

              with open(
                  arquivo_txt,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(texto)

              comando = [
                  "piper",
                  "--model",
                  "voz/pt_BR-faber-medium.onnx",
                  "--config",
                  "voz/pt_BR-faber-medium.onnx.json",
                  "--input_file",
                  arquivo_txt,
                  "--output_file",
                  arquivo_audio
              ]

              subprocess.run(
                  comando,
                  check=True
              )

              print(
                  f"Áudio da cena {numero} criado."
              )
          PY

          ls -lh audios/

      # ============================================================
      # 8. BUSCAR VÍDEOS NO PEXELS
      # ============================================================

      - name: Buscar vídeos no Pexels
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          mkdir -p videos

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import time

          with open(
              "cenas.json",
              encoding="utf-8"
          ) as f:

              cenas = json.load(f)

          with open(
              "config.txt",
              encoding="utf-8"
          ) as f:

              config = {}

              for linha in f:

                  if "=" in linha:

                      k, v = (
                          linha
                          .rstrip("\n")
                          .split("=", 1)
                      )

                      config[k] = v

          formato = config.get(
              "FORMATO",
              "short"
          )

          api_key = os.environ[
              "PEXELS_API_KEY"
          ]

          usados = set()
          creditos = []

          for cena in cenas:

              numero = cena["numero"]
              busca = cena["busca"]

              params = urllib.parse.urlencode(
                  {
                      "query": busca,
                      "orientation": (
                          "portrait"
                          if formato == "short"
                          else "landscape"
                      ),
                      "size": "medium",
                      "per_page": 20
                  }
              )

              url = (
                  "https://api.pexels.com/videos/search?"
                  + params
              )

              print(
                  f"Buscando vídeo para cena "
                  f"{numero}: {busca}"
              )

              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": api_key,
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=60
              ) as response:

                  dados = json.loads(
                      response.read()
                      .decode("utf-8")
                  )

              videos = dados.get(
                  "videos",
                  []
              )

              escolhido = None

              for video in videos:

                  video_id = video.get(
                      "id"
                  )

                  if video_id in usados:
                      continue

                  arquivos = video.get(
                      "video_files",
                      []
                  )

                  arquivos_validos = [
                      x for x in arquivos
                      if x.get("link")
                  ]

                  if not arquivos_validos:
                      continue

                  escolhido = (
                      video,
                      arquivos_validos
                  )

                  break

              if not escolhido:

                  raise RuntimeError(
                      "Nenhum vídeo único encontrado "
                      f"para a cena {numero}."
                  )

              video, arquivos = escolhido

              usados.add(
                  video["id"]
              )

              if formato == "short":

                  proporcao_alvo = 9 / 16

              else:

                  proporcao_alvo = 16 / 9

              arquivos.sort(
                  key=lambda x:
                  abs(
                      (
                          x.get(
                              "width",
                              1080
                          )
                          /
                          max(
                              x.get(
                                  "height",
                                  1920
                              ),
                              1
                          )
                      )
                      - proporcao_alvo
                  )
              )

              link = arquivos[0]["link"]

              arquivo_saida = (
                  f"videos/cena_{numero}.mp4"
              )

              req_video = urllib.request.Request(
                  link,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              with urllib.request.urlopen(
                  req_video,
                  timeout=120
              ) as response, open(
                  arquivo_saida,
                  "wb"
              ) as out:

                  while True:

                      bloco = response.read(
                          1024 * 1024
                      )

                      if not bloco:
                          break

                      out.write(bloco)

              creditos.append(
                  f"Cena {numero}: "
                  f"https://www.pexels.com/video/"
                  f"{video['id']}/"
              )

              time.sleep(0.5)

          with open(
              "pexels-credit.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "Vídeos utilizados via Pexels:\n\n"
              )

              f.write(
                  "\n".join(creditos)
              )

          print(
              "Vídeos baixados com sucesso."
          )
          PY

          ls -lh videos/

      # ============================================================
      # 9. CRIAR LEGENDAS
      # ============================================================

      - name: Criar legendas
        run: |
          mkdir -p legendas

          python - <<'PY'
          import json
          import wave

          with open(
              "cenas.json",
              encoding="utf-8"
          ) as f:

              cenas = json.load(f)

          with open(
              "config.txt",
              encoding="utf-8"
          ) as f:

              config = {}

              for linha in f:

                  if "=" in linha:

                      k, v = (
                          linha
                          .rstrip("\n")
                          .split("=", 1)
                      )

                      config[k] = v

          formato = config.get(
              "FORMATO",
              "short"
          )

          if formato == "short":

              largura = 1080
              altura = 1920
              margem_vertical = 260

          else:

              largura = 1920
              altura = 1080
              margem_vertical = 100

          def duracao_audio(
              arquivo
          ):

              with wave.open(
                  arquivo,
                  "rb"
              ) as w:

                  return (
                      w.getnframes()
                      /
                      w.getframerate()
                  )

          def ass_time(
              segundos
          ):

              segundos = max(
                  0,
                  segundos
              )

              h = int(
                  segundos // 3600
              )

              m = int(
                  (
                      segundos % 3600
                  ) // 60
              )

              s = int(
                  segundos % 60
              )

              cs = int(
                  (
                      segundos
                      - int(segundos)
                  )
                  * 100
              )

              return (
                  f"{h}:"
                  f"{m:02d}:"
                  f"{s:02d}."
                  f"{cs:02d}"
              )

          inicio = 0.0

          for cena in cenas:

              numero = cena["numero"]

              arquivo_audio = (
                  f"audios/cena_{numero}.wav"
              )

              duracao = duracao_audio(
                  arquivo_audio
              )

              fim = inicio + duracao

              arquivo_ass = (
                  f"legendas/cena_{numero}.ass"
              )

              texto = cena["texto"].replace(
                  "\n",
                  " "
              )

              conteudo = f"""[Script Info]
          ScriptType: v4.00+
          PlayResX: {largura}
          PlayResY: {altura}

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,DejaVu Sans,52,&H00FFFFFF,&H00FFFFFF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,3,2,2,60,60,{margem_vertical},1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          Dialogue: 0,{ass_time(inicio)},{ass_time(fim)},Default,,0,0,0,,{texto}
          """

              with open(
                  arquivo_ass,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(conteudo)

              inicio = fim

          print(
              "Legendas criadas."
          )
          PY

      # ============================================================
      # 10. CRIAR CLIPES
      # ============================================================

      - name: Criar clipes individuais
        run: |
          mkdir -p clips

          python - <<'PY'
          import json
          import subprocess
          import wave

          with open(
              "cenas.json",
              encoding="utf-8"
          ) as f:

              cenas = json.load(f)

          with open(
              "config.txt",
              encoding="utf-8"
          ) as f:

              config = {}

              for linha in f:

                  if "=" in linha:

                      k, v = (
                          linha
                          .rstrip("\n")
                          .split("=", 1)
                      )

                      config[k] = v

          formato = config.get(
              "FORMATO",
              "short"
          )

          if formato == "short":

              largura = 1080
              altura = 1920

          else:

              largura = 1920
              altura = 1080

          def duracao_audio(
              path
          ):

              with wave.open(
                  path,
                  "rb"
              ) as w:

                  return (
                      w.getnframes()
                      /
                      w.getframerate()
                  )

          for cena in cenas:

              numero = cena["numero"]

              audio = (
                  f"audios/cena_{numero}.wav"
              )

              video = (
                  f"videos/cena_{numero}.mp4"
              )

              legenda = (
                  f"legendas/cena_{numero}.ass"
              )

              saida = (
                  f"clips/cena_{numero}.mp4"
              )

              duracao = duracao_audio(
                  audio
              )

              filtro = (
                  f"scale={largura}:{altura}:"
                  "force_original_aspect_ratio=increase,"
                  f"crop={largura}:{altura},"
                  f"subtitles={legenda}:"
                  "force_style='"
                  "FontName=DejaVu Sans,"
                  "FontSize=52,"
                  "PrimaryColour=&H00FFFFFF,"
                  "OutlineColour=&H00000000,"
                  "Outline=3,"
                  "Shadow=2,"
                  "Alignment=2,"
                  (
                      "MarginV=260'"
                      if formato == "short"
                      else "MarginV=100'"
                  )
              )

              comando = [
                  "ffmpeg",
                  "-y",
                  "-stream_loop",
                  "-1",
                  "-i",
                  video,
                  "-t",
                  str(duracao),
                  "-vf",
                  filtro,
                  "-r",
                  "30",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-pix_fmt",
                  "yuv420p",
                  saida
              ]

              subprocess.run(
                  comando,
                  check=True
              )

              print(
                  f"Clip {numero} criado."
              )
          PY

      # ============================================================
      # 11. TRANSIÇÕES
      # ============================================================

      - name: Criar vídeo com transições
        run: |
          python - <<'PY'
          import json
          import subprocess

          with open(
              "cenas.json",
              encoding="utf-8"
          ) as f:

              cenas = json.load(f)

          arquivos = [
              f"clips/cena_{c['numero']}.mp4"
              for c in cenas
          ]

          if len(arquivos) == 1:

              subprocess.run(
                  [
                      "ffmpeg",
                      "-y",
                      "-i",
                      arquivos[0],
                      "-c",
                      "copy",
                      "video-sem-audio.mp4"
                  ],
                  check=True
              )

              raise SystemExit

          inputs = []

          for arquivo in arquivos:

              inputs.extend([
                  "-i",
                  arquivo
              ])

          duracoes = []

          for arquivo in arquivos:

              comando = [
                  "ffprobe",
                  "-v",
                  "error",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  arquivo
              ]

              resultado = subprocess.check_output(
                  comando
              ).decode().strip()

              duracoes.append(
                  float(resultado)
              )

          transicao = min(
              0.30,
              min(duracoes) / 3.0
          )

          tipos = [
              "fade",
              "smoothleft",
              "wiperight",
              "slideup",
              "circleopen"
          ]

          filtros = []

          acumulado = duracoes[0]

          for i in range(
              1,
              len(arquivos)
          ):

              entrada_a = (
                  "[0:v]"
                  if i == 1
                  else f"[v{i-1}]"
              )

              entrada_b = (
                  f"[{i}:v]"
              )

              saida = (
                  f"[v{i}]"
                  if i < len(arquivos) - 1
                  else "[vfinal]"
              )

              offset = (
                  acumulado
                  - transicao
              )

              tipo = tipos[
                  (i - 1) % len(tipos)
              ]

              filtros.append(
                  f"{entrada_a}{entrada_b}"
                  f"xfade="
                  f"transition={tipo}:"
                  f"duration={transicao}:"
                  f"offset={offset}"
                  f"{saida}"
              )

              acumulado += (
                  duracoes[i]
                  - transicao
              )

          filtro_complexo = ";".join(
              filtros
          )

          comando = [
              "ffmpeg",
              "-y"
          ]

          comando.extend(
              inputs
          )

          comando.extend([
              "-filter_complex",
              filtro_complexo,
              "-map",
              "[vfinal]",
              "-an",
              "-c:v",
              "libx264",
              "-preset",
              "veryfast",
              "-pix_fmt",
              "yuv420p",
              "-r",
              "30",
              "video-sem-audio.mp4"
          ])

          subprocess.run(
              comando,
              check=True
          )

          print(
              "Vídeo com transições criado."
          )
          PY

      # ============================================================
      # 12. JUNTAR NARRAÇÕES
      # ============================================================

      - name: Juntar narrações
        run: |
          rm -f audios.txt

          python - <<'PY'
          import json

          with open(
              "cenas.json",
              encoding="utf-8"
          ) as f:

              cenas = json.load(f)

          with open(
              "audios.txt",
              "w",
              encoding="utf-8"
          ) as f:

              for cena in cenas:

                  numero = cena["numero"]

                  f.write(
                      f"file 'audios/cena_{numero}.wav'\n"
                  )
          PY

          ffmpeg \
            -y \
            -f concat \
            -safe 0 \
            -i audios.txt \
            -c:a pcm_s16le \
            narracao-final.wav

      # ============================================================
      # 13. CRIAR MÚSICA DE FUNDO
      # ============================================================

      - name: Criar música de fundo
        run: |
          DURACAO=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            narracao-final.wav)

          ffmpeg \
            -y \
            -f lavfi \
            -i "sine=frequency=220:sample_rate=44100" \
            -t "$DURACAO" \
            -c:a pcm_s16le \
            musica-fundo.wav

      # ============================================================
      # 14. MIXAR ÁUDIO
      # ============================================================

      - name: Mixar áudio final
        run: |
          ffmpeg \
            -y \
            -i narracao-final.wav \
            -i musica-fundo.wav \
            -filter_complex \
            "[1:a]volume=0.12[musica];[0:a][musica]amix=inputs=2:duration=first:dropout_transition=2[a]" \
            -map "[a]" \
            -c:a aac \
            -b:a 192k \
            audio-final.m4a

      # ============================================================
      # 15. JUNTAR VÍDEO + ÁUDIO
      # ============================================================

      - name: Criar vídeo final
        run: |
          ffmpeg \
            -y \
            -i video-sem-audio.mp4 \
            -i audio-final.m4a \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v copy \
            -c:a aac \
            -b:a 192k \
            -shortest \
            short-final.mp4

      # ============================================================
      # 16. VALIDAR RESULTADO
      # ============================================================

      - name: Validar resultado
        run: |
          test -f short-final.mp4
          test -f youtube-metadata.json
          test -f cenas.json
          test -f roteiro.txt
          test -f narracao-final.wav
          test -f audio-final.m4a

          echo "======================================"
          echo "VÍDEO FINAL"
          echo "======================================"

          ls -lh short-final.mp4

          echo ""
          echo "======================================"
          echo "METADATA"
          echo "======================================"

          cat youtube-metadata.json

          echo ""
          echo "======================================"
          echo "CONFIGURAÇÃO"
          echo "======================================"

          cat config.txt

          echo ""
          echo "Validação concluída."

      # ============================================================
      # 17. CRIAR THUMBNAIL LOCAL
      # ============================================================

      - name: Criar thumbnail
        run: |
          ffmpeg \
            -y \
            -ss 1 \
            -i short-final.mp4 \
            -frames:v 1 \
            -q:v 2 \
            thumbnail.jpg

          ls -lh thumbnail.jpg

      # ============================================================
      # 18. ORGANIZAR RESULTADO
      # ============================================================

      - name: Organizar resultado
        run: |
          mkdir -p resultado

          cp short-final.mp4 resultado/
          cp thumbnail.jpg resultado/
          cp youtube-metadata.json resultado/
          cp cenas.json resultado/
          cp roteiro.txt resultado/
          cp roteiro-gerado.txt resultado/
          cp narracao-final.wav resultado/
          cp audio-final.m4a resultado/
          cp musica-fundo.wav resultado/
          cp pexels-credit.txt resultado/
          cp config.txt resultado/

          cp -r audios resultado/
          cp -r videos resultado/
          cp -r clips resultado/
          cp -r legendas resultado/

          echo "Arquivos finais:"
          find resultado -maxdepth 2 -type f

      # ============================================================
      # 19. SALVAR ARTIFACT
      # ============================================================

      - name: Enviar resultado para próxima etapa
        uses: actions/upload-artifact@v4
        with:
          name: short-gerado
          path: resultado/
          retention-days: 7
