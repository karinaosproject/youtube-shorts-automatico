      # ============================================================

      - name: Criar legendas
        run: |
          mkdir -p legendas

          python - <<'PY'
          import json
          import wave
          import re

          with open(
              "cenas.json",
              encoding="utf-8"
          ) as f:

              cenas = json.load(f)

          config = {}

          with open(
              "config.txt",
              encoding="utf-8"
          ) as f:

              for linha in f:

                  if "=" in linha:

                      k, v = (
                          linha
                          .rstrip("\n")
                          .split("=", 1)
                      )

                      config[k] = v

          formato = config.get(
              "FORMATO",
              "short"
          )

          if formato == "short":

              largura = 1080
              altura = 1920
              margem_vertical = 280
              fonte = 58

          else:

              largura = 1920
              altura = 1080
              margem_vertical = 90
              fonte = 54

          def duracao_audio(path):

              with wave.open(
                  path,
                  "rb"
              ) as w:

                  return (
                      w.getnframes()
                      /
                      w.getframerate()
                  )

          def ass_time(segundos):

              segundos = max(
                  0,
                  segundos
              )

              h = int(
                  segundos // 3600
              )

              m = int(
                  (segundos % 3600) // 60
              )

              s = int(
                  segundos % 60
              )

              cs = int(
                  (segundos - int(segundos))
                  * 100
              )

              return (
                  f"{h}:"
                  f"{m:02d}:"
                  f"{s:02d}."
                  f"{cs:02d}"
              )

          def limpar(texto):

              texto = texto.replace(
                  "\n",
                  " "
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()

          def dividir_em_blocos(texto):

              palavras = limpar(
                  texto
              ).split()

              blocos = []

              atual = []

              for palavra in palavras:

                  atual.append(
                      palavra
                  )

                  if (
                      len(atual) >= 5
                      or
                      palavra.endswith(
                          (".", ",", "!", "?")
                      )
                  ):

                      blocos.append(
                          " ".join(atual)
                      )

                      atual = []

              if atual:
                  blocos.append(
                      " ".join(atual)
                  )

              return blocos

          for cena in cenas:

              numero = cena["numero"]

              audio = (
                  f"audios/cena_{numero}.wav"
              )

              duracao = duracao_audio(
                  audio
              )

              blocos = dividir_em_blocos(
                  cena["texto"]
              )

              if not blocos:
                  continue

              palavras_total = sum(
                  len(
                      bloco.split()
                  )
                  for bloco in blocos
              )

              tempo = 0.0

              eventos = []

              for i, bloco in enumerate(
                  blocos
              ):

                  quantidade = max(
                      len(
                          bloco.split()
                      ),
                      1
                  )

                  if i == len(blocos) - 1:

                      fim = duracao

                  else:

                      fim = (
                          tempo
                          +
                          duracao
                          *
                          quantidade
                          /
                          palavras_total
                      )

                  texto_ass = (
                      bloco
                      .replace(
                          "{",
                          "\\{"
                      )
                      .replace(
                          "}",
                          "\\}"
                      )
                  )

                  eventos.append(
                      f"Dialogue: 0,"
                      f"{ass_time(tempo)},"
                      f"{ass_time(fim)},"
                      f"Default,,0,0,0,,"
                      f"{texto_ass}"
                  )

                  tempo = fim

              conteudo = f"""[Script Info]
          ScriptType: v4.00+
          PlayResX: {largura}
          PlayResY: {altura}

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,DejaVu Sans,{fonte},&H00FFFFFF,&H00FFFFFF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,3,2,2,70,70,{margem_vertical},1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          {chr(10).join(eventos)}
          """

              with open(
                  f"legendas/cena_{numero}.ass",
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(conteudo)

          print(
              "Legendas curtas criadas."
          )
          PY

