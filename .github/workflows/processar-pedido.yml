      # ============================================================
      # 9. CALCULAR DURAÇÕES DOS VISUAIS
      # ============================================================

      - name: Criar plano de edição
        run: |
          python - <<'PY'
          import json
          import wave

          with open(
              "cenas.json",
              encoding="utf-8"
          ) as f:

              cenas = json.load(f)

          def duracao_audio(path):

              with wave.open(
                  path,
                  "rb"
              ) as w:

                  return (
                      w.getnframes()
                      /
                      w.getframerate()
                  )

          plano = []

          for cena in cenas:

              numero = cena["numero"]

              audio_path = (
                  f"audios/cena_{numero}.wav"
              )

              duracao = duracao_audio(
                  audio_path
              )

              palavras = max(
                  len(
                      cena["texto"]
                      .split()
                  ),
                  1
              )

              visuais = cena["visuais"]

              total_visuais = len(
                  visuais
              )

              pesos = []

              for visual in visuais:

                  busca = visual["busca"]

                  palavras_busca = max(
                      len(
                          busca.split()
                      ),
                      1
                  )

                  pesos.append(
                      palavras_busca
                  )

              soma_pesos = sum(
                  pesos
              )

              atual = 0.0

              plano_visuais = []

              for index, visual in enumerate(
                  visuais,
                  start=1
              ):

                  if index == total_visuais:

                      fim = duracao

                  else:

                      parte = (
                          pesos[index - 1]
                          / soma_pesos
                      )

                      fim = (
                          atual
                          + duracao * parte
                      )

                  plano_visuais.append(
                      {
                          "arquivo": (
                              f"videos/"
                              f"cena_{numero}_visual_"
                              f"{index}.mp4"
                          ),
                          "busca": visual["busca"],
                          "inicio": atual,
                          "fim": fim
                      }
                  )

                  atual = fim

              plano.append(
                  {
                      "numero": numero,
                      "duracao": duracao,
                      "palavras": palavras,
                      "visuais": plano_visuais
                  }
              )

          with open(
              "plano-edicao.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  plano,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              json.dumps(
                  plano,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

