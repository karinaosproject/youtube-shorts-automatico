          PY


      # ==========================================
      # 11. CALCULAR DURAÇÃO REAL
      # ==========================================

      - name: Calcular duração final
        run: |
          DURACAO_REAL=$(
            ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              narracao-completa.wav
          )

          echo "Duração real da narração: $DURACAO_REAL"

          python - <<PY
          import os

          valor = float(
              "$DURACAO_REAL"
          )

          with open(
              os.environ["GITHUB_ENV"],
              "a"
          ) as f:

              f.write(
                  f"DURACAO_REAL={valor:.3f}\n"
              )
          PY


      # ==========================================
      # 12. MÚSICA DE FUNDO
      # ==========================================

      - name: Criar música de fundo
        run: |
          DURACAO_MUSICA="${DURACAO_REAL}"

          ffmpeg -y \
            -f lavfi \
            -i "sine=frequency=220:sample_rate=44100" \
            -f lavfi \
            -i "sine=frequency=277.18:sample_rate=44100" \
            -f lavfi \
            -i "sine=frequency=329.63:sample_rate=44100" \
            -filter_complex \
            "[0:a]volume=0.18[a0];[1:a]volume=0.12[a1];[2:a]volume=0.10[a2];[a0][a1][a2]amix=inputs=3:duration=longest,afade=t=in:st=0:d=2[m]" \
            -t "$DURACAO_MUSICA" \
            -map "[m]" \
            -c:a libmp3lame \
            -b:a 128k \
            musica-background.mp3

          test -s musica-background.mp3

          echo "Música de fundo pronta."


      # ==========================================
      # 13. CRIAR VÍDEO FINAL
      # ==========================================

      - name: Criar vídeo final
        run: |
          ffmpeg -y \
            -i video-completo.mp4 \
            -i narracao-completa.wav \
            -i musica-background.mp3 \
            -filter_complex \
            "[2:a]volume=0.12[musica];[1:a][musica]amix=inputs=2:duration=first:dropout_transition=2[audio]" \
            -map 0:v:0 \
            -map "[audio]" \
            -c:v copy \
            -c:a aac \
            -ar 44100 \
            -ac 2 \
            -b:a 192k \
            -shortest \
            -movflags +faststart \
            short-final.mp4

          test -s short-final.mp4

          echo ""
          echo "================================"
          echo "VÍDEO FINALIZADO"
          echo "================================"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -show_entries stream=width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            short-final.mp4


      # ==========================================
      # 14. SALVAR ARTEFATO
      # ==========================================

      - name: Salvar conteúdo gerado
        uses: actions/upload-artifact@v4
        with:
          name: short-gerado
          path: |
            short-final.mp4
            roteiro.txt
            cenas.json
            youtube-metadata.json
            narracao-completa.wav
            pexels-credit.txt
            subtitles/
            videos/
            clips/
            audios/
            musica-background.mp3
          if-no-files-found: error
