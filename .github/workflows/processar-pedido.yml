name: Processar pedido de Short

on:
  issues:
    types: [opened]

jobs:
  criar-short:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. FFMPEG
      # ==========================================

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          ffmpeg -version
          ffprobe -version

      # ==========================================
      # 2. PIPER
      # ==========================================

      - name: Instalar Piper TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install piper-tts

          python -m piper --help

      # ==========================================
      # 3. LER PEDIDO
      # ==========================================

      - name: Ler pedido
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          echo "================================"
          echo "🎬 NOVO PEDIDO DE SHORT"
          echo "================================"

          echo "Título:"
          echo "$ISSUE_TITLE"

          echo ""
          echo "Pedido:"
          echo "$ISSUE_BODY"

          echo "================================"

      # ==========================================
      # 4. GEMINI
      # ==========================================

      - name: Gerar roteiro e cenas com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          api_key = os.environ["GEMINI_API_KEY"].strip()
          pedido = os.environ["ISSUE_BODY"].strip()

          if not api_key:
              raise Exception(
                  "GEMINI_API_KEY não foi encontrada."
              )

          prompt = f"""
          Você é um roteirista profissional de YouTube Shorts.

          Crie um Short em português brasileiro baseado no pedido abaixo.

          O vídeo deve ter aproximadamente 30 a 60 segundos.

          DIVIDA o roteiro em EXATAMENTE 6 CENAS.

          Cada cena precisa conter:

          TEXTO:
          O texto que será narrado naquela cena.

          BUSCA:
          Uma busca curta em inglês para encontrar um vídeo
          vertical visualmente relacionado no Pexels.

          REGRAS:

          - Comece com um gancho forte.
          - Frases curtas.
          - Ritmo rápido.
          - Informações interessantes.
          - Não use introdução desnecessária.
          - Termine com uma frase de impacto.
          - Cada cena deve representar uma parte diferente.
          - As buscas devem ser visuais e concretas.
          - Use de 1 a 4 palavras em cada busca.
          - Evite buscas abstratas.
          - Não repita a mesma busca.
          - Não coloque título dentro dos textos.
          - Não coloque explicações.
          - Não use listas.
          - Não use emojis.

          METADADOS PARA O YOUTUBE:

          TITULO: um título curto, curioso e forte, com até 70 caracteres.

          DESCRICAO: uma descrição natural e envolvente, relacionada ao tema,
          com palavras-chave relevantes. Não faça spam de palavras-chave.

          HASHTAGS: exatamente 5 hashtags relevantes para o tema.

          FORMATO OBRIGATÓRIO:

          TITULO: título aqui
          DESCRICAO: descrição aqui, sem quebrar linha
          HASHTAGS: #hashtag1 #hashtag2 #hashtag3 #hashtag4 #hashtag5

          CENA 1
          TEXTO: texto da cena 1
          BUSCA: english visual search

          CENA 2
          TEXTO: texto da cena 2
          BUSCA: english visual search

          CENA 3
          TEXTO: texto da cena 3
          BUSCA: english visual search

          CENA 4
          TEXTO: texto da cena 4
          BUSCA: english visual search

          CENA 5
          TEXTO: texto da cena 5
          BUSCA: english visual search

          CENA 6
          TEXTO: texto da cena 6
          BUSCA: english visual search

          PEDIDO:
          {pedido}
          """

          data = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.8
              }
          }

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-3.1-flash-lite:"
              "generateContent"
          )

          request = urllib.request.Request(
              url,
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": api_key,
                  "User-Agent": "youtube-shorts-automatico/1.0"
              },
              method="POST"
          )

          try:
              print("🧠 Enviando pedido para Gemini...")

              with urllib.request.urlopen(
                  request,
                  timeout=180
              ) as response:
                  resultado = json.load(response)

          except urllib.error.HTTPError as e:
              print("❌ ERRO DA API GEMINI")
              print("Código:", e.code)

              corpo = e.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(corpo)
              raise

          texto = (
              resultado["candidates"][0]
              ["content"]["parts"][0]["text"]
          )

          print("")
          print("================================")
          print("🧠 RESPOSTA DO GEMINI")
          print("================================")
          print(texto)
          print("================================")

          linhas = [
              linha.strip()
              for linha in texto.splitlines()
          ]

          cenas = []

          titulo = ""
          descricao = ""
          hashtags = ""

          cena_atual = None
          texto_atual = []
          busca_atual = None

          for linha in linhas:

              if not linha:
                  continue

              linha_upper = linha.upper()

              if linha_upper.startswith("TITULO:"):

                  titulo = linha[
                      len("TITULO:"):
                  ].strip()

              elif linha_upper.startswith("DESCRICAO:"):

                  descricao = linha[
                      len("DESCRICAO:"):
                  ].strip()

              elif linha_upper.startswith("HASHTAGS:"):

                  hashtags = linha[
                      len("HASHTAGS:"):
                  ].strip()

              elif linha_upper.startswith("CENA "):

                  if cena_atual is not None:
                      cenas.append({
                          "texto": " ".join(
                              texto_atual
                          ).strip(),
                          "busca": (
                              busca_atual or ""
                          ).strip()
                      })

                  cena_atual = linha
                  texto_atual = []
                  busca_atual = None

              elif linha_upper.startswith("TEXTO:"):

                  valor = linha[
                      len("TEXTO:"):
                  ].strip()

                  if valor:
                      texto_atual.append(valor)

              elif linha_upper.startswith("BUSCA:"):

                  busca_atual = linha[
                      len("BUSCA:"):
                  ].strip()

          if cena_atual is not None:
              cenas.append({
                  "texto": " ".join(
                      texto_atual
                  ).strip(),
                  "busca": (
                      busca_atual or ""
                  ).strip()
              })

          # ==========================================
          # VALIDAR METADADOS
          # ==========================================

          if not titulo:
              raise Exception(
                  "Gemini não gerou TITULO."
              )

          if len(titulo) > 70:
              titulo = titulo[:70].rstrip()

          if not descricao:
              raise Exception(
                  "Gemini não gerou DESCRICAO."
              )

          lista_hashtags = [
              h
              for h in hashtags.split()
              if h.startswith("#")
          ]

          if len(lista_hashtags) != 5:
              raise Exception(
                  f"Gemini retornou "
                  f"{len(lista_hashtags)} hashtags. "
                  "Esperadas exatamente 5."
              )

          hashtags = " ".join(
              lista_hashtags
          )

          # ==========================================
          # VALIDAR CENAS
          # ==========================================

          if len(cenas) != 6:
              raise Exception(
                  f"Gemini retornou {len(cenas)} cenas. "
                  "Esperadas exatamente 6."
              )

          for i, cena in enumerate(
              cenas,
              start=1
          ):

              if not cena["texto"]:
                  raise Exception(
                      f"Cena {i} sem texto."
                  )

              if not cena["busca"]:
                  raise Exception(
                      f"Cena {i} sem busca."
                  )

          # ==========================================
          # SALVAR CENAS
          # ==========================================

          with open(
              "cenas.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  cenas,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ==========================================
          # SALVAR ROTEIRO
          # ==========================================

          with open(
              "roteiro.txt",
              "w",
              encoding="utf-8"
          ) as f:

              for cena in cenas:

                  f.write(
                      cena["texto"].strip()
                      + "\n\n"
                  )

          # ==========================================
          # SALVAR METADADOS
          # ==========================================

          with open(
              "youtube-metadata.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  {
                      "titulo": titulo,
                      "descricao": descricao,
                      "hashtags": hashtags
                  },
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("================================")
          print("✅ METADADOS GERADOS")
          print("================================")
          print("Título:", titulo)
          print("Descrição:", descricao)
          print("Hashtags:", hashtags)

          print("")
          print("================================")
          print("✅ 6 CENAS GERADAS")
          print("================================")

          for i, cena in enumerate(
              cenas,
              start=1
          ):

              print("")
              print(f"CENA {i}")
              print("Texto:", cena["texto"])
              print("Busca:", cena["busca"])

          print("================================")
          PY

      # ==========================================
      # 5. BAIXAR VOZ PIPER
      # ==========================================

      - name: Baixar voz Piper PT-BR
        run: |
          mkdir -p models

          wget -q --show-progress \
            -O models/pt_BR-faber-medium.onnx \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx"

          wget -q --show-progress \
            -O models/pt_BR-faber-medium.onnx.json \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx.json"

          test -s models/pt_BR-faber-medium.onnx
          test -s models/pt_BR-faber-medium.onnx.json

          echo "✅ Modelo Piper pronto."

      # ==========================================
      # 6. NARRAÇÃO
      # ==========================================

      - name: Gerar narrações das cenas
        run: |
          python - <<'PY'
          import json
          import subprocess
          import os

          with open(
              "cenas.json",
              "r",
              encoding="utf-8"
          ) as f:
              cenas = json.load(f)

          os.makedirs(
              "audios",
              exist_ok=True
          )

          for i, cena in enumerate(
              cenas,
              start=1
          ):

              texto = cena["texto"].strip()

              arquivo = (
                  f"audios/cena-{i:02d}.wav"
              )

              print("")
              print("================================")
              print(f"🎙️ CENA {i}/6")
              print("================================")

              processo = subprocess.run(
                  [
                      "python",
                      "-m",
                      "piper",
                      "--model",
                      "models/pt_BR-faber-medium.onnx",
                      "--output_file",
                      arquivo
                  ],
                  input=texto,
                  text=True
              )

              if processo.returncode != 0:
                  raise Exception(
                      f"Piper falhou na cena {i}."
                  )

              if not os.path.exists(arquivo):
                  raise Exception(
                      f"Áudio da cena {i} não foi criado."
                  )

              if os.path.getsize(arquivo) == 0:
                  raise Exception(
                      f"Áudio vazio na cena {i}."
                  )

              print(
                  f"✅ Áudio da cena {i} pronto."
              )

          print("")
          print("================================")
          print("🎙️ 6 NARRAÇÕES PRONTAS")
          print("================================")
          PY

      # ==========================================
      # 7. PEXELS
      # ==========================================

      - name: Buscar vídeos no Pexels
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import urllib.parse
          import time

          api_key = os.environ.get(
              "PEXELS_API_KEY",
              ""
          ).strip()

          if not api_key:
              raise Exception(
                  "PEXELS_API_KEY não foi encontrada."
              )

          with open(
              "cenas.json",
              "r",
              encoding="utf-8"
          ) as f:
              cenas = json.load(f)

          os.makedirs(
              "videos",
              exist_ok=True
          )

          user_agent = (
              "Mozilla/5.0 "
              "(Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/120.0 Safari/537.36"
          )

          usados = set()

          for indice, cena in enumerate(
              cenas,
              start=1
          ):

              busca = cena["busca"].strip()

              print("")
              print("================================")
              print(f"🎞️ CENA {indice}/6")
              print("================================")
              print("Busca:", busca)

              params = urllib.parse.urlencode({
                  "query": busca,
                  "orientation": "portrait",
                  "size": "medium",
                  "per_page": 20
              })

              url = (
                  "https://api.pexels.com/v1/"
                  "videos/search?"
                  + params
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": api_key,
                      "User-Agent": user_agent,
                      "Accept": "application/json"
                  },
                  method="GET"
              )

              resultado = None

              for tentativa in range(1, 4):

                  try:

                      print(
                          f"📡 Tentativa {tentativa}/3"
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=60
                      ) as response:

                          resultado = json.load(
                              response
                          )

                      break

                  except urllib.error.HTTPError as e:

                      corpo = e.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      print(
                          "⚠️ Erro HTTP:",
                          e.code
                      )

                      print(corpo)

                      if e.code == 429:
                          time.sleep(10)
                          continue

                      raise

              if resultado is None:
                  raise Exception(
                      f"Pexels não respondeu "
                      f"para cena {indice}."
                  )

              videos = resultado.get(
                  "videos",
                  []
              )

              if not videos:
                  raise Exception(
                      f"Nenhum vídeo encontrado "
                      f"para: {busca}"
                  )

              escolhido = None

              # Primeiro tenta vídeo vertical
              for video in videos:

                  video_id = video.get("id")

                  if video_id in usados:
                      continue

                  for arquivo in video.get(
                      "video_files",
                      []
                  ):

                      largura = arquivo.get(
                          "width",
                          0
                      )

                      altura = arquivo.get(
                          "height",
                          0
                      )

                      link = arquivo.get(
                          "link"
                      )

                      if (
                          link
                          and altura
                          and largura
                          and altura > largura
                      ):

                          escolhido = {
                              "id": video_id,
                              "page": video.get(
                                  "url"
                              ),
                              "link": link
                          }

                          break

                  if escolhido:
                      break

              # Fallback para qualquer vídeo
              if not escolhido:

                  for video in videos:

                      video_id = video.get("id")

                      if video_id in usados:
                          continue

                      for arquivo in video.get(
                          "video_files",
                          []
                      ):

                          link = arquivo.get(
                              "link"
                          )

                          if link:

                              escolhido = {
                                  "id": video_id,
                                  "page": video.get(
                                      "url"
                                  ),
                                  "link": link
                              }

                              break

                      if escolhido:
                          break

              if not escolhido:
                  raise Exception(
                      f"Não foi possível escolher "
                      f"vídeo para cena {indice}."
                  )

              usados.add(
                  escolhido["id"]
              )

              print(
                  "✅ Vídeo escolhido:",
                  escolhido["id"]
              )

              download_request = (
                  urllib.request.Request(
                      escolhido["link"],
                      headers={
                          "User-Agent": user_agent,
                          "Accept": "*/*"
                      },
                      method="GET"
                  )
              )

              arquivo_saida = (
                  f"videos/cena-{indice:02d}.mp4"
              )

              with urllib.request.urlopen(
                  download_request,
                  timeout=180
              ) as response:

                  with open(
                      arquivo_saida,
                      "wb"
                  ) as f:

                      while True:

                          bloco = response.read(
                              1024 * 1024
                          )

                          if not bloco:
                              break

                          f.write(bloco)

              if not os.path.getsize(
                  arquivo_saida
              ):
                  raise Exception(
                      f"Vídeo vazio na cena {indice}."
                  )

              cena["pexels_id"] = (
                  escolhido["id"]
              )

              cena["pexels_page"] = (
                  escolhido["page"]
              )

              print(
                  "✅ Download concluído."
              )

          with open(
              "cenas.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  cenas,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # Créditos Pexels
          with open(
              "pexels-credit.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "Vídeos utilizados neste Short:\n\n"
              )

              for i, cena in enumerate(
                  cenas,
                  start=1
              ):

                  f.write(
                      f"Cena {i}: "
                      f"{cena.get('pexels_page', '')}\n"
                  )

          print("")
          print("================================")
          print("🎞️ 6 VÍDEOS BAIXADOS")
          print("================================")
          PY

      # ==========================================
      # 8. CRIAR LEGENDAS E CLIPES
      # ==========================================

      - name: Criar legendas e clipes
        run: |
          mkdir -p clips
          mkdir -p subtitles

          python - <<'PY'
          import json
          import subprocess
          import os
          import re
          import textwrap

          with open(
              "cenas.json",
              "r",
              encoding="utf-8"
          ) as f:
              cenas = json.load(f)

          def ass_time(segundos):

              segundos = max(
                  0,
                  segundos
              )

              horas = int(
                  segundos // 3600
              )

              minutos = int(
                  (segundos % 3600) // 60
              )

              seg = int(
                  segundos % 60
              )

              centesimos = int(
                  round(
                      (
                          segundos
                          - int(segundos)
                      ) * 100
                  )
              )

              if centesimos >= 100:
                  centesimos = 99

              return (
                  f"{horas}:"
                  f"{minutos:02d}:"
                  f"{seg:02d}."
                  f"{centesimos:02d}"
              )

          def limpar_ass(texto):

              texto = texto.replace(
                  "\\",
                  ""
              )

              texto = texto.replace(
                  "{",
                  "("
              )

              texto = texto.replace(
                  "}",
                  ")"
              )

              texto = texto.replace(
                  "\n",
                  " "
              )

              return texto.strip()

          for i, cena in enumerate(
              cenas,
              start=1
          ):

              texto = cena["texto"].strip()

              audio = (
                  f"audios/cena-{i:02d}.wav"
              )

              video = (
                  f"videos/cena-{i:02d}.mp4"
              )

              ass = (
                  f"subtitles/cena-{i:02d}.ass"
              )

              clip = (
                  f"clips/cena-{i:02d}.mp4"
              )

              duracao = float(
                  subprocess.check_output(
                      [
                          "ffprobe",
                          "-v",
                          "error",
                          "-show_entries",
                          "format=duration",
                          "-of",
                          "default=noprint_wrappers=1:nokey=1",
                          audio
                      ]
                  ).decode().strip()
              )

              print("")
              print("================================")
              print(f"📝 LEGENDA CENA {i}")
              print("================================")
              print(
                  f"Duração: {duracao:.2f}s"
              )

              # --------------------------------------
              # FRASES
              # --------------------------------------

              frases = re.split(
                  r'(?<=[.!?])\s+',
                  texto
              )

              frases = [
                  frase.strip()
                  for frase in frases
                  if frase.strip()
              ]

              if not frases:
                  frases = [texto]

              total_palavras = sum(
                  len(frase.split())
                  for frase in frases
              )

              if total_palavras <= 0:
                  total_palavras = 1

              # --------------------------------------
              # CRIAR ASS
              # --------------------------------------

              with open(
                  ass,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      "[Script Info]\n"
                  )

                  f.write(
                      "ScriptType: v4.00+\n"
                  )

                  f.write(
                      "PlayResX: 1080\n"
                  )

                  f.write(
                      "PlayResY: 1920\n"
                  )

                  f.write(
                      "WrapStyle: 2\n"
                  )

                  f.write(
                      "ScaledBorderAndShadow: yes\n"
                  )

                  f.write(
                      "\n"
                  )

                  f.write(
                      "[V4+ Styles]\n"
                  )

                  f.write(
                      "Format: Name, "
                      "Fontname, Fontsize, "
                      "PrimaryColour, "
                      "SecondaryColour, "
                      "OutlineColour, "
                      "BackColour, "
                      "Bold, Italic, "
                      "Underline, StrikeOut, "
                      "ScaleX, ScaleY, "
                      "Spacing, Angle, "
                      "BorderStyle, Outline, "
                      "Shadow, Alignment, "
                      "MarginL, MarginR, MarginV, "
                      "Encoding\n"
                  )

                  f.write(
                      "Style: Default,"
                      "DejaVu Sans,"
                      "52,"
                      "&H00FFFFFF,"
                      "&H00FFFFFF,"
                      "&H00000000,"
                      "&H80000000,"
                      "1,0,0,0,"
                      "100,100,0,0,"
                      "1,3,2,2,"
                      "70,70,180,1\n"
                  )

                  f.write(
                      "\n"
                  )

                  f.write(
                      "[Events]\n"
                  )

                  f.write(
                      "Format: Layer, "
                      "Start, End, Style, "
                      "Name, MarginL, "
                      "MarginR, MarginV, "
                      "Effect, Text\n"
                  )

                  tempo_atual = 0.0

                  for frase in frases:

                      palavras = max(
                          1,
                          len(frase.split())
                      )

                      duracao_frase = (
                          duracao
                          * palavras
                          / total_palavras
                      )

                      inicio = tempo_atual
                      fim = min(
                          duracao,
                          tempo_atual
                          + duracao_frase
                      )

                      frase_limpa = limpar_ass(
                          frase
                      )

                      # Quebra linhas longas
                      linhas_frase = textwrap.wrap(
                          frase_limpa,
                          width=28
                      )

                      texto_ass = (
                          "\\N".join(
                              linhas_frase
                          )
                      )

                      f.write(
                          "Dialogue: 0,"
                          f"{ass_time(inicio)},"
                          f"{ass_time(fim)},"
                          "Default,,"
                          "0,0,0,0,,"
                          f"{texto_ass}\n"
                      )

                      tempo_atual = fim

              # --------------------------------------
              # CRIAR CLIP
              # --------------------------------------

              subprocess.run(
                  [
                      "ffmpeg",
                      "-y",
                      "-stream_loop",
                      "-1",
                      "-i",
                      video,
                      "-i",
                      audio,
                      "-vf",
                      (
                          "scale=1080:1920:"
                          "force_original_aspect_ratio=increase,"
                          "crop=1080:1920,"
                          f"subtitles={ass}"
                      ),
                      "-map",
                      "0:v:0",
                      "-map",
                      "1:a:0",
                      "-t",
                      str(duracao),
                      "-c:v",
                      "libx264",
                      "-preset",
                      "veryfast",
                      "-crf",
                      "23",
                      "-pix_fmt",
                      "yuv420p",
                      "-c:a",
                      "aac",
                      "-b:a",
                      "192k",
                      "-movflags",
                      "+faststart",
                      clip
                  ],
                  check=True
              )

              print(
                  f"✅ Clip da cena {i} pronto."
              )

          print("")
          print("================================")
          print("🎬 6 CLIPES PRONTOS")
          print("================================")
          PY

      # ==========================================
      # 9. JUNTAR CENAS COM TRANSIÇÕES
      # ==========================================

      - name: Montar vídeo completo
        run: |
          python - <<'PY'
          import subprocess
          import os

          clips = [
              f"clips/cena-{i:02d}.mp4"
              for i in range(1, 7)
          ]

          duracoes = []

          for clip in clips:

              duracao = float(
                  subprocess.check_output(
                      [
                          "ffprobe",
                          "-v",
                          "error",
                          "-show_entries",
                          "format=duration",
                          "-of",
                          "default=noprint_wrappers=1:nokey=1",
                          clip
                      ]
                  ).decode().strip()
              )

              duracoes.append(duracao)

          transicao = 0.35

          filtros = []
          entradas = []

          for i in range(6):

              filtros.append(
                  f"[{i}:v]"
                  f"setpts=PTS-STARTPTS"
                  f"[v{i}]"
              )

              entradas.append(
                  f"[v{i}]"
              )

          atual = "v0"
          offset = duracoes[0] - transicao

          for i in range(1, 6):

              saida = f"x{i}"

              transicao_tipo = [
                  "fade",
                  "smoothleft",
                  "wiperight",
                  "slideup",
                  "circleopen"
              ][i - 1]

              filtros.append(
                  f"[{atual}][v{i}]"
                  f"xfade="
                  f"transition={transicao_tipo}:"
                  f"duration={transicao}:"
                  f"offset={offset}"
                  f"[{saida}]"
              )

              atual = saida

              offset += (
                  duracoes[i]
                  - transicao
              )

          filtro_final = ";".join(
              filtros
          )

          comando = [
              "ffmpeg",
              "-y"
          ]

          for clip in clips:
              comando.extend(
                  [
                      "-i",
                      clip
                  ]
              )

          comando.extend(
              [
                  "-filter_complex",
                  filtro_final,
                  "-map",
                  f"[{atual}]",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "23",
                  "-pix_fmt",
                  "yuv420p",
                  "video-completo.mp4"
              ]
          )

          subprocess.run(
              comando,
              check=True
          )

          print("")
          print("================================")
          print("🎬 VÍDEO COMPLETO PRONTO")
          print("================================")
          PY

      # ==========================================
      # 10. JUNTAR NARRAÇÃO
      # ==========================================

      - name: Juntar narrações
        run: |
          python - <<'PY'
          import subprocess

          lista = "audios.txt"

          with open(
              lista,
              "w",
              encoding="utf-8"
          ) as f:

              for i in range(1, 7):

                  f.write(
                      f"file 'audios/cena-{i:02d}.wav'\n"
                  )

          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  lista,
                  "-c:a",
                  "pcm_s16le",
                  "narracao-completa.wav"
              ],
              check=True
          )

          print("")
          print("================================")
          print("🎙️ NARRAÇÃO COMPLETA PRONTA")
          print("================================")
          PY

      # ==========================================
      # 11. MÚSICA DE FUNDO
      # ==========================================

      - name: Criar música de fundo
        run: |
          mkdir -p musica

          ffmpeg -y \
            -f lavfi \
            -i "sine=frequency=220:sample_rate=44100" \
            -f lavfi \
            -i "sine=frequency=277.18:sample_rate=44100" \
            -f lavfi \
            -i "sine=frequency=329.63:sample_rate=44100" \
            -filter_complex \
            "[0:a]volume=0.18[a0];[1:a]volume=0.12[a1];[2:a]volume=0.10[a2];[a0][a1][a2]amix=inputs=3:duration=longest,afade=t=in:st=0:d=2,afade=t=out:st=55:d=5" \
            -t 60 \
            -c:a libmp3lame \
            -b:a 128k \
            musica/background.mp3

          echo "✅ Música de fundo pronta."

      # ==========================================
      # 12. MIXAGEM FINAL
      # ==========================================

      - name: Criar Short final
        run: |
          ffmpeg \
            -y \
            -i video-completo.mp4 \
            -i narracao-completa.wav \
            -stream_loop -1 \
            -i musica/background.mp3 \
            -filter_complex \
            "[2:a]volume=0.12[musica];[1:a][musica]amix=inputs=2:duration=first:dropout_transition=2[audio]" \
            -map 0:v:0 \
            -map "[audio]" \
            -c:v copy \
            -c:a aac \
            -b:a 192k \
            -shortest \
            -movflags +faststart \
            short-final.mp4

          echo ""
          echo "================================"
          echo "🎉 SHORT FINALIZADO"
          echo "================================"

          ffprobe \
            -v error \
            -show_entries \
            format=duration \
            -show_entries \
            stream=width,height \
            -of default=noprint_wrappers=1 \
            short-final.mp4

      # ==========================================
      # 13. ARTEFATO
      # ==========================================

      - name: Salvar Short gerado
        uses: actions/upload-artifact@v4
        with:
          name: short-gerado
          path: |
            short-final.mp4
            roteiro.txt
            cenas.json
            youtube-metadata.json
            narracao-completa.wav
            pexels-credit.txt
            subtitles/
            videos/
            clips/
            audios/
            musica/
