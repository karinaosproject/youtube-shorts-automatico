name: Processar pedido de Short

on:
  issues:
    types: [opened]

jobs:
  criar-roteiro:
    runs-on: ubuntu-latest

    steps:
      - name: Ler pedido
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          echo "================================"
          echo "🎬 NOVO PEDIDO DE SHORT"
          echo "================================"
          echo "Título:"
          echo "$ISSUE_TITLE"
          echo ""
          echo "Pedido:"
          echo "$ISSUE_BODY"
          echo "================================"

      - name: Gerar roteiro com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          api_key = os.environ["GEMINI_API_KEY"]
          pedido = os.environ["ISSUE_BODY"]

          prompt = f"""
          Você é um roteirista profissional de YouTube Shorts.

          Crie um roteiro curto, envolvente e pronto para narração
          baseado no pedido abaixo.

          REGRAS:
          - Comece com um gancho forte.
          - Não use introdução desnecessária.
          - Use frases curtas.
          - Mantenha ritmo rápido.
          - Seja interessante e fácil de entender.
          - Termine com uma frase de impacto.
          - Respeite o idioma solicitado.
          - Entregue somente o roteiro.

          PEDIDO:
          {pedido}
          """

          data = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ]
          }

          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"

          request = urllib.request.Request(
              url,
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": api_key
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  resultado = json.load(response)

          except urllib.error.HTTPError as e:
              print("================================")
              print("❌ ERRO DA API GEMINI")
              print("================================")
              print("Código HTTP:", e.code)
              print("Resposta do Google:")
              print(e.read().decode("utf-8"))
              print("================================")
              raise

          except Exception as e:
              print("================================")
              print("❌ ERRO AO CHAMAR GEMINI")
              print("================================")
              print(str(e))
              print("================================")
              raise

          try:
              roteiro = resultado["candidates"][0]["content"]["parts"][0]["text"]

          except Exception:
              print("================================")
              print("❌ RESPOSTA INESPERADA DO GEMINI")
              print("================================")
              print(json.dumps(resultado, indent=2, ensure_ascii=False))
              print("================================")
              raise

          print("")
          print("================================")
          print("🧠 ROTEIRO GERADO PELO GEMINI")
          print("================================")
          print(roteiro)
          print("================================")
          PY
