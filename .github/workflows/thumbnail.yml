name: Gerar Thumbnail

on:
  workflow_run:
    workflows: ["Publicar vídeo no YouTube"]
    types:
      - completed

jobs:
  thumbnail:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:
      - name: Baixar artefato da publicação
        uses: actions/download-artifact@v4
        with:
          name: resultado-publicacao-youtube
          path: resultado
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verificar arquivos
        run: |
          echo "Arquivos recebidos:"
          find resultado -maxdepth 3 -type f -print

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests

      - name: Gerar thumbnail profissional
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import sys
          import requests

          from io import BytesIO
          from PIL import Image
          from PIL import ImageDraw
          from PIL import ImageFont
          from PIL import ImageEnhance
          from PIL import ImageFilter

          # ==========================================================
          # ARQUIVOS
          # ==========================================================

          METADATA_FILE = "resultado/youtube-metadata.json"
          OUTPUT_FILE = "resultado/thumbnail.jpg"
          CREDIT_FILE = "resultado/pexels-credit.txt"

          if not os.path.exists(METADATA_FILE):
              print("ERRO: youtube-metadata.json não encontrado.")
              sys.exit(1)

          API_KEY = os.environ.get("PEXELS_API_KEY", "").strip()

          if not API_KEY:
              print("ERRO: PEXELS_API_KEY não configurada.")
              sys.exit(1)

          with open(METADATA_FILE, "r", encoding="utf-8") as f:
              metadata = json.load(f)

          titulo = str(metadata.get("titulo", "")).strip()

          if not titulo:
              print("ERRO: título vazio.")
              sys.exit(1)

          titulo = " ".join(titulo.split())

          print("==========================================")
          print("GERADOR DE THUMBNAIL V2")
          print("==========================================")
          print(f"Título: {titulo}")

          # ==========================================================
          # CONFIGURAÇÃO
          # ==========================================================

          W = 1280
          H = 720

          # ==========================================================
          # PALAVRAS IRRELEVANTES PARA BUSCA
          # ==========================================================

          ignoradas = {
              "a", "o", "as", "os",
              "um", "uma", "uns", "umas",
              "de", "do", "da", "dos", "das",
              "em", "no", "na", "nos", "nas",
              "por", "para", "com",
              "e", "ou", "que",
              "como", "sobre",
              "mais", "menos",
              "se", "é",
              "são", "um", "uma"
          }

          # ==========================================================
          # TRADUÇÕES PARA BUSCA VISUAL
          # ==========================================================

          traducoes = {
              "baleia": "whale",
              "baleias": "whales",
              "azul": "blue whale",
              "tubarão": "shark",
              "tubarões": "sharks",
              "golfinho": "dolphin",
              "golfinhos": "dolphins",
              "leão": "lion",
              "leões": "lions",
              "tigre": "tiger",
              "tigres": "tigers",
              "elefante": "elephant",
              "elefantes": "elephants",
              "girafa": "giraffe",
              "girafas": "giraffes",
              "cachorro": "dog",
              "cachorros": "dogs",
              "gato": "cat",
              "gatos": "cats",
              "aves": "birds",
              "pássaro": "bird",
              "pássaros": "birds",
              "inseto": "insect",
              "insetos": "insects",
              "dinossauro": "dinosaur",
              "dinossauros": "dinosaurs",
              "oceano": "ocean",
              "oceanos": "ocean",
              "mar": "ocean",
              "floresta": "forest",
              "natureza": "nature",
              "espaço": "space",
              "universo": "universe",
              "planeta": "planet",
              "planetas": "planets",
              "terra": "earth",
              "lua": "moon",
              "sol": "sun",
              "vulcão": "volcano",
              "vulcões": "volcano",
              "cérebro": "brain",
              "ciência": "science",
              "ciencia": "science",
              "psicologia": "psychology",
              "humano": "human",
              "humanos": "humans",
              "corpo": "human body",
              "água": "water",
              "fogo": "fire",
              "tecnologia": "technology",
              "robô": "robot",
              "robôs": "robots",
              "cidade": "city",
              "história": "history",
              "histórico": "history",
              "comida": "food",
              "alimentos": "food"
          }

          palavras = re.findall(
              r"[A-Za-zÀ-ÿ0-9]+",
              titulo.lower()
          )

          importantes = [
              p for p in palavras
              if p not in ignoradas
              and len(p) >= 3
          ]

          if not importantes:
              importantes = palavras[:5]

          termos = importantes[:7]

          termos_ingles = [
              traducoes.get(p, p)
              for p in termos
          ]

          busca = " ".join(termos_ingles)

          print(f"Busca principal: {busca}")

          # ==========================================================
          # BUSCA PEXELS
          # ==========================================================

          headers = {
              "Authorization": API_KEY,
              "User-Agent": "KarinaOS-Thumbnail/2.0"
          }

          endpoint = "https://api.pexels.com/v1/search"

          parametros = {
              "query": busca,
              "orientation": "landscape",
              "size": "large",
              "per_page": 30,
              "locale": "en-US"
          }

          resposta = requests.get(
              endpoint,
              headers=headers,
              params=parametros,
              timeout=30
          )

          if resposta.status_code != 200:
              print(
                  "ERRO Pexels:",
                  resposta.status_code,
                  resposta.text[:1000]
              )
              sys.exit(1)

          dados = resposta.json()
          fotos = dados.get("photos", [])

          if not fotos:
              print("Nenhuma imagem encontrada.")
              sys.exit(1)

          # ==========================================================
          # ESCOLHA DA IMAGEM
          #
          # Preferimos imagens:
          # - grandes
          # - horizontais
          # - próximas de 16:9
          # ==========================================================

          melhor = None
          melhor_pontuacao = -999999

          for foto in fotos:

              largura = int(foto.get("width", 0))
              altura = int(foto.get("height", 0))

              if largura < 1000 or altura < 500:
                  continue

              proporcao = largura / altura

              diferenca = abs(
                  proporcao - (16 / 9)
              )

              pontuacao = 100

              pontuacao -= diferenca * 60

              if largura >= 1800:
                  pontuacao += 15

              if altura >= 1000:
                  pontuacao += 10

              # Fotos extremamente panorâmicas recebem penalidade.
              if proporcao > 2.2:
                  pontuacao -= 25

              if pontuacao > melhor_pontuacao:
                  melhor_pontuacao = pontuacao
                  melhor = foto

          if melhor is None:
              melhor = fotos[0]

          src = melhor.get("src", {})

          imagem_url = (
              src.get("large2x")
              or src.get("large")
              or src.get("original")
          )

          if not imagem_url:
              print("ERRO: URL da imagem não encontrada.")
              sys.exit(1)

          foto_id = melhor.get("id")
          fotografo = melhor.get(
              "photographer",
              "Pexels"
          )
          pagina = melhor.get("url", "")

          print(f"Imagem escolhida: {foto_id}")
          print(f"Fotógrafo: {fotografo}")

          # ==========================================================
          # DOWNLOAD
          # ==========================================================

          download = requests.get(
              imagem_url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              },
              timeout=60
          )

          if download.status_code != 200:
              print(
                  "ERRO ao baixar imagem:",
                  download.status_code
              )
              sys.exit(1)

          imagem = Image.open(
              BytesIO(download.content)
          ).convert("RGB")

          print(
              f"Imagem original: "
              f"{imagem.width}x{imagem.height}"
          )

          # ==========================================================
          # CROP 16:9
          # ==========================================================

          alvo = W / H
          atual = imagem.width / imagem.height

          if atual > alvo:

              nova_largura = int(
                  imagem.height * alvo
              )

              esquerda = (
                  imagem.width - nova_largura
              ) // 2

              imagem = imagem.crop(
                  (
                      esquerda,
                      0,
                      esquerda + nova_largura,
                      imagem.height
                  )
              )

          else:

              nova_altura = int(
                  imagem.width / alvo
              )

              topo = (
                  imagem.height - nova_altura
              ) // 2

              imagem = imagem.crop(
                  (
                      0,
                      topo,
                      imagem.width,
                      topo + nova_altura
                  )
              )

          imagem = imagem.resize(
              (W, H),
              Image.Resampling.LANCZOS
          )

          # ==========================================================
          # TRATAMENTO CINEMATOGRÁFICO
          # ==========================================================

          imagem = ImageEnhance.Contrast(
              imagem
          ).enhance(1.16)

          imagem = ImageEnhance.Color(
              imagem
          ).enhance(1.12)

          imagem = ImageEnhance.Sharpness(
              imagem
          ).enhance(1.10)

          # ==========================================================
          # ESCURECER O LADO ESQUERDO
          #
          # O objetivo é criar espaço para o texto sem esconder
          # completamente a fotografia.
          # ==========================================================

          overlay = Image.new(
              "RGBA",
              (W, H),
              (0, 0, 0, 0)
          )

          od = ImageDraw.Draw(overlay)

          for x in range(W):

              proporcao = x / W

              if proporcao < 0.62:
                  intensidade = int(
                      150 * (1 - proporcao / 0.62)
                  )
              else:
                  intensidade = 0

              od.line(
                  (x, 0, x, H),
                  fill=(
                      0,
                      0,
                      0,
                      intensidade
                  )
              )

          # Escurecimento suave na parte inferior.
          for y in range(H):

              proporcao = y / H

              intensidade = int(
                  65 * proporcao
              )

              od.line(
                  (0, y, W, y),
                  fill=(
                      0,
                      0,
                      0,
                      intensidade
                  )
              )

          imagem = Image.alpha_composite(
              imagem.convert("RGBA"),
              overlay
          ).convert("RGB")

          # ==========================================================
          # VINHETA
          # ==========================================================

          vinheta = Image.new(
              "RGBA",
              (W, H),
              (0, 0, 0, 0)
          )

          vd = ImageDraw.Draw(vinheta)

          # Camadas suaves nas bordas.
          for margem in range(80):

              alpha = int(
                  70 * (1 - margem / 80)
              )

              vd.rectangle(
                  (
                      margem,
                      margem,
                      W - margem,
                      H - margem
                  ),
                  outline=(
                      0,
                      0,
                      0,
                      alpha
                  ),
                  width=1
              )

          imagem = Image.alpha_composite(
              imagem.convert("RGBA"),
              vinheta
          ).convert("RGB")

          draw = ImageDraw.Draw(imagem)

          # ==========================================================
          # FONTE
          # ==========================================================

          fontes = [
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"
          ]

          fonte_path = None

          for caminho in fontes:

              if os.path.exists(caminho):
                  fonte_path = caminho
                  break

          if fonte_path is None:
              print("ERRO: fonte não encontrada.")
              sys.exit(1)

          def get_font(tamanho):
              return ImageFont.truetype(
                  fonte_path,
                  tamanho
              )

          # ==========================================================
          # CRIAR TEXTO CURTO
          #
          # A thumbnail não usa o título inteiro.
          # ==========================================================

          palavras_titulo = titulo.split()

          # Remove termos muito genéricos da versão da thumbnail.
          palavras_visuais = [
              p for p in palavras_titulo
              if p.lower() not in ignoradas
          ]

          if len(palavras_visuais) >= 2:

              # Prioriza as primeiras palavras relevantes.
              texto_thumb = " ".join(
                  palavras_visuais[:5]
              )

          else:
              texto_thumb = titulo

          # ==========================================================
          # TENTATIVA DE REDUZIR TEXTO EXCESSIVO
          # ==========================================================

          if len(texto_thumb) > 34:

              texto_thumb = " ".join(
                  texto_thumb.split()[:4]
              )

          print(
              f"Texto da thumbnail: {texto_thumb}"
          )

          # ==========================================================
          # FONTE PRINCIPAL
          # ==========================================================

          tamanho = 88

          while tamanho >= 54:

              fonte_principal = get_font(tamanho)

              caixa = draw.multiline_textbbox(
                  (0, 0),
                  texto_thumb,
                  font=fonte_principal,
                  spacing=4,
                  stroke_width=4
              )

              largura_texto = (
                  caixa[2] - caixa[0]
              )

              if largura_texto <= 700:
                  break

              tamanho -= 4

          # ==========================================================
          # QUEBRA DE LINHAS
          # ==========================================================

          palavras = texto_thumb.split()

          linhas = []
          linha_atual = ""

          largura_maxima = 700

          for palavra in palavras:

              teste = (
                  palavra
                  if not linha_atual
                  else linha_atual + " " + palavra
              )

              caixa = draw.textbbox(
                  (0, 0),
                  teste,
                  font=fonte_principal,
                  stroke_width=4
              )

              largura = (
                  caixa[2] - caixa[0]
              )

              if largura <= largura_maxima:

                  linha_atual = teste

              else:

                  if linha_atual:
                      linhas.append(
                          linha_atual
                      )

                  linha_atual = palavra

          if linha_atual:
              linhas.append(
                  linha_atual
              )

          linhas = linhas[:3]

          # ==========================================================
          # MEDIR TEXTO
          # ==========================================================

          alturas = []

          for linha in linhas:

              caixa = draw.textbbox(
                  (0, 0),
                  linha,
                  font=fonte_principal,
                  stroke_width=5
              )

              alturas.append(
                  caixa[3] - caixa[1]
              )

          espacamento = 10

          altura_total = (
              sum(alturas)
              + espacamento * (
                  len(linhas) - 1
              )
          )

          # ==========================================================
          # POSICIONAMENTO
          # ==========================================================

          x = 55

          y = (
              H - altura_total
          ) / 2

          # ==========================================================
          # PEQUENA LINHA DE DESTAQUE
          #
          # Não é logo nem marca d'água.
          # Serve apenas para criar hierarquia visual.
          # ==========================================================

          altura_destaque = (
              altura_total + 30
          )

          draw.rounded_rectangle(
              (
                  x,
                  y - 18,
                  x + 12,
                  y + altura_destaque
              ),
              radius=6,
              fill="white"
          )

          # ==========================================================
          # TEXTO PRINCIPAL
          # ==========================================================

          for indice, linha in enumerate(linhas):

              caixa = draw.textbbox(
                  (0, 0),
                  linha,
                  font=fonte_principal,
                  stroke_width=5
              )

              altura = (
                  caixa[3] - caixa[1]
              )

              draw.text(
                  (
                      x + 35,
                      y
                  ),
                  linha,
                  font=fonte_principal,
                  fill="white",
                  stroke_width=8,
                  stroke_fill="black"
              )

              y += (
                  altura
                  + espacamento
              )

          # ==========================================================
          # PEQUENO EFEITO DE PROFUNDIDADE
          # ==========================================================

          sombra = Image.new(
              "RGBA",
              (W, H),
              (0, 0, 0, 0)
          )

          sd = ImageDraw.Draw(sombra)

          sd.rectangle(
              (
                  0,
                  H - 90,
                  W,
                  H
              ),
              fill=(0, 0, 0, 35)
          )

          sombra = sombra.filter(
              ImageFilter.GaussianBlur(12)
          )

          imagem = Image.alpha_composite(
              imagem.convert("RGBA"),
              sombra
          ).convert("RGB")

          # ==========================================================
          # SALVAR
          # ==========================================================

          imagem.save(
              OUTPUT_FILE,
              "JPEG",
              quality=96,
              optimize=True
          )

          # ==========================================================
          # CRÉDITO SEPARADO
          # ==========================================================

          with open(
              CREDIT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "Imagem utilizada na thumbnail: Pexels\n"
              )

              f.write(
                  f"Fotógrafo: {fotografo}\n"
              )

              f.write(
                  f"Página da imagem: {pagina}\n"
              )

              f.write(
                  "Fonte: https://www.pexels.com/\n"
              )

          # ==========================================================
          # VALIDAÇÃO
          # ==========================================================

          final = Image.open(
              OUTPUT_FILE
          )

          if final.size != (1280, 720):
              print(
                  "ERRO: tamanho final incorreto:",
                  final.size
              )
              sys.exit(1)

          print("==========================================")
          print("THUMBNAIL V2 GERADA")
          print("==========================================")
          print("1280x720")
          print("Imagem temática do Pexels")
          print("Texto reduzido")
          print("Composição cinematográfica")
          print("Sem borda externa")
          print("Sem painel gigante")
          print("Sem logo")
          print("Sem assinatura")
          print("Sem marca d'água")
          print("==========================================")
          PY

      - name: Salvar thumbnail para download
        uses: actions/upload-artifact@v4
        with:
          name: thumbnail-youtube
          path: |
            resultado/thumbnail.jpg
            resultado/pexels-credit.txt
          if-no-files-found: error

      - name: Finalizar
        run: |
          echo "=========================================="
          echo "THUMBNAIL V2 FINALIZADA"
          echo "=========================================="
          echo "Arquivo: thumbnail.jpg"
          echo "Tamanho: 1280x720"
          echo "Sem marca d'água."
          echo "Disponível no artefato thumbnail-youtube."