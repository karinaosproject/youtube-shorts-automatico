name: Gerar Thumbnail

on:
  workflow_run:
    workflows: ["Publicar vídeo no YouTube"]
    types:
      - completed

jobs:
  thumbnail:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:
      - name: Baixar artefato da publicação
        uses: actions/download-artifact@v4
        with:
          name: resultado-publicacao-youtube
          path: resultado
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verificar arquivos
        run: |
          echo "Arquivos recebidos:"
          find resultado -maxdepth 3 -type f -print

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests

      - name: Gerar thumbnail temática
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import sys
          import textwrap
          import requests

          from io import BytesIO
          from PIL import Image, ImageDraw, ImageFont, ImageFilter, ImageEnhance

          METADATA_FILE = "resultado/youtube-metadata.json"
          OUTPUT_FILE = "resultado/thumbnail.jpg"
          CREDIT_FILE = "resultado/pexels-credit.txt"

          # ==========================================================
          # VALIDAÇÕES
          # ==========================================================

          if not os.path.exists(METADATA_FILE):
              print("ERRO: youtube-metadata.json não encontrado.")
              sys.exit(1)

          api_key = os.environ.get("PEXELS_API_KEY", "").strip()

          if not api_key:
              print("ERRO: PEXELS_API_KEY não configurada.")
              sys.exit(1)

          with open(METADATA_FILE, "r", encoding="utf-8") as f:
              metadata = json.load(f)

          titulo = str(metadata.get("titulo", "")).strip()

          if not titulo:
              print("ERRO: título do vídeo não encontrado.")
              sys.exit(1)

          titulo = " ".join(titulo.split())

          print(f"Título do vídeo: {titulo}")

          # ==========================================================
          # CONVERTER TÍTULO EM BUSCA
          # ==========================================================

          palavras_ignoradas = {
              "a", "o", "as", "os",
              "um", "uma", "uns", "umas",
              "de", "do", "da", "dos", "das",
              "em", "no", "na", "nos", "nas",
              "por", "para", "com",
              "e", "ou",
              "que", "como",
              "sobre",
              "se"
          }

          palavras = re.findall(
              r"[A-Za-zÀ-ÿ0-9]+",
              titulo.lower()
          )

          palavras_importantes = [
              palavra
              for palavra in palavras
              if palavra not in palavras_ignoradas
              and len(palavra) >= 3
          ]

          if not palavras_importantes:
              palavras_importantes = palavras[:5]

          # Pega no máximo as palavras mais relevantes do título.
          termos = palavras_importantes[:6]

          busca = " ".join(termos)

          # Inglês costuma trazer uma variedade visual maior no Pexels.
          traducoes = {
              "animais": "animals",
              "animal": "animal",
              "cachorro": "dog",
              "cães": "dogs",
              "gato": "cat",
              "gatos": "cats",
              "leão": "lion",
              "leões": "lions",
              "tigre": "tiger",
              "tigres": "tigers",
              "aves": "birds",
              "pássaros": "birds",
              "mar": "ocean",
              "oceano": "ocean",
              "floresta": "forest",
              "natureza": "nature",
              "espaço": "space",
              "planeta": "planet",
              "planetas": "planets",
              "universo": "universe",
              "cérebro": "brain",
              "ciencia": "science",
              "ciência": "science",
              "psicologia": "psychology",
              "humano": "human",
              "humanos": "humans",
              "corpo": "human body",
              "água": "water",
              "fogo": "fire",
              "vulcão": "volcano",
              "vulcões": "volcano",
              "dinossauro": "dinosaur",
              "dinossauros": "dinosaurs",
              "insetos": "insects",
              "inseto": "insect",
              "comida": "food",
              "casa": "home",
              "cidade": "city",
              "tecnologia": "technology",
              "robô": "robot",
              "robôs": "robots",
              "eletrônica": "electronics",
              "história": "history",
              "terra": "earth",
          }

          termos_busca = [
              traducoes.get(t, t)
              for t in termos
          ]

          busca_ingles = " ".join(termos_busca)

          print(f"Busca no Pexels: {busca_ingles}")

          # ==========================================================
          # BUSCAR IMAGEM NO PEXELS
          # ==========================================================

          headers = {
              "Authorization": api_key,
              "User-Agent": "KarinaOS-Thumbnail/1.0"
          }

          url = "https://api.pexels.com/v1/search"

          params = {
              "query": busca_ingles,
              "orientation": "landscape",
              "size": "large",
              "per_page": 15,
              "locale": "en-US"
          }

          resposta = requests.get(
              url,
              headers=headers,
              params=params,
              timeout=30
          )

          if resposta.status_code != 200:
              print(
                  "ERRO Pexels:",
                  resposta.status_code,
                  resposta.text[:1000]
              )
              sys.exit(1)

          dados = resposta.json()

          fotos = dados.get("photos", [])

          if not fotos:
              print("Nenhuma imagem encontrada no Pexels.")
              sys.exit(1)

          # ==========================================================
          # ESCOLHER A MELHOR IMAGEM
          # ==========================================================

          melhor = None
          melhor_pontuacao = -1

          for foto in fotos:
              largura = int(foto.get("width", 0))
              altura = int(foto.get("height", 0))

              if largura <= 0 or altura <= 0:
                  continue

              proporcao = largura / altura

              # Preferência por imagens próximas de 16:9.
              diferenca = abs(proporcao - (16 / 9))

              pontuacao = 100 - (diferenca * 50)

              if largura >= 1600:
                  pontuacao += 20

              if altura >= 900:
                  pontuacao += 10

              if pontuacao > melhor_pontuacao:
                  melhor_pontuacao = pontuacao
                  melhor = foto

          if melhor is None:
              melhor = fotos[0]

          foto_url = (
              melhor
              .get("src", {})
              .get("large2x")
              or melhor
              .get("src", {})
              .get("large")
          )

          if not foto_url:
              print("ERRO: Pexels não retornou URL da imagem.")
              sys.exit(1)

          foto_id = melhor.get("id")
          pagina_pexels = melhor.get("url", "")
          fotografo = melhor.get("photographer", "Pexels")

          print(f"Foto Pexels selecionada: {foto_id}")
          print(f"Fotógrafo: {fotografo}")
          print(f"Página: {pagina_pexels}")

          # ==========================================================
          # BAIXAR IMAGEM
          # ==========================================================

          imagem_resposta = requests.get(
              foto_url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              },
              timeout=60
          )

          if imagem_resposta.status_code != 200:
              print(
                  "ERRO ao baixar imagem:",
                  imagem_resposta.status_code
              )
              sys.exit(1)

          imagem = Image.open(
              BytesIO(imagem_resposta.content)
          ).convert("RGB")

          # ==========================================================
          # TAMANHO FINAL
          # ==========================================================

          LARGURA = 1280
          ALTURA = 720

          proporcao_destino = LARGURA / ALTURA
          proporcao_original = imagem.width / imagem.height

          # ==========================================================
          # CROP CINEMATOGRÁFICO
          # ==========================================================

          if proporcao_original > proporcao_destino:
              nova_largura = int(
                  imagem.height * proporcao_destino
              )

              esquerda = (
                  imagem.width - nova_largura
              ) // 2

              imagem = imagem.crop(
                  (
                      esquerda,
                      0,
                      esquerda + nova_largura,
                      imagem.height
                  )
              )

          else:
              nova_altura = int(
                  imagem.width / proporcao_destino
              )

              topo = (
                  imagem.height - nova_altura
              ) // 2

              imagem = imagem.crop(
                  (
                      0,
                      topo,
                      imagem.width,
                      topo + nova_altura
                  )
              )

          imagem = imagem.resize(
              (LARGURA, ALTURA),
              Image.Resampling.LANCZOS
          )

          # ==========================================================
          # TRATAMENTO DE IMAGEM
          # ==========================================================

          imagem = ImageEnhance.Contrast(imagem).enhance(1.12)
          imagem = ImageEnhance.Color(imagem).enhance(1.08)
          imagem = ImageEnhance.Sharpness(imagem).enhance(1.08)

          # ==========================================================
          # FUNDO ESCURECIDO
          # ==========================================================

          overlay = Image.new(
              "RGBA",
              (LARGURA, ALTURA),
              (0, 0, 0, 0)
          )

          overlay_draw = ImageDraw.Draw(overlay)

          # Escurece principalmente a área do texto.
          for x in range(LARGURA):
              intensidade = int(
                  175 * max(
                      0,
                      1 - (x / LARGURA) * 1.4
                  )
              )

              overlay_draw.rectangle(
                  (
                      x,
                      0,
                      x + 1,
                      ALTURA
                  ),
                  fill=(0, 0, 0, intensidade)
              )

          # Gradiente inferior.
          for y in range(ALTURA):
              intensidade = int(
                  120 * (y / ALTURA)
              )

              overlay_draw.line(
                  (
                      0,
                      y,
                      LARGURA,
                      y
                  ),
                  fill=(0, 0, 0, intensidade)
              )

          imagem = Image.alpha_composite(
              imagem.convert("RGBA"),
              overlay
          ).convert("RGB")

          draw = ImageDraw.Draw(imagem)

          # ==========================================================
          # FONTES
          # ==========================================================

          fontes = [
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"
          ]

          fonte_path = None

          for caminho in fontes:
              if os.path.exists(caminho):
                  fonte_path = caminho
                  break

          if fonte_path is None:
              print("ERRO: fonte não encontrada.")
              sys.exit(1)

          def fonte(tamanho):
              return ImageFont.truetype(
                  fonte_path,
                  tamanho
              )

          # ==========================================================
          # TEXTO CURTO PARA THUMBNAIL
          # ==========================================================

          # A thumbnail não deve repetir um título gigantesco.
          # Tenta encontrar uma versão curta baseada no próprio título.

          palavras_titulo = titulo.split()

          if len(palavras_titulo) > 8:
              palavras_thumb = palavras_titulo[:8]
          else:
              palavras_thumb = palavras_titulo

          texto_thumb = " ".join(
              palavras_thumb
          )

          # ==========================================================
          # QUEBRA DE LINHAS
          # ==========================================================

          tamanho_fonte = 82
          fonte_principal = fonte(tamanho_fonte)

          largura_maxima = 760

          linhas = []
          linha = ""

          for palavra in texto_thumb.split():

              teste = (
                  palavra
                  if not linha
                  else linha + " " + palavra
              )

              caixa = draw.textbbox(
                  (0, 0),
                  teste,
                  font=fonte_principal,
                  stroke_width=5
              )

              largura = caixa[2] - caixa[0]

              if largura <= largura_maxima:
                  linha = teste
              else:
                  if linha:
                      linhas.append(linha)

                  linha = palavra

          if linha:
              linhas.append(linha)

          linhas = linhas[:4]

          # ==========================================================
          # PAINEL DE TEXTO
          # ==========================================================

          altura_linhas = []

          for linha in linhas:
              caixa = draw.textbbox(
                  (0, 0),
                  linha,
                  font=fonte_principal,
                  stroke_width=5
              )

              altura_linhas.append(
                  caixa[3] - caixa[1]
              )

          espacamento = 12

          altura_total = (
              sum(altura_linhas)
              + espacamento * max(
                  0,
                  len(linhas) - 1
              )
          )

          margem_x = 55
          margem_y = 55

          painel_topo = max(
              margem_y,
              (ALTURA - altura_total) // 2 - 35
          )

          painel_baixo = min(
              ALTURA - margem_y,
              painel_topo
              + altura_total
              + 70
          )

          # ==========================================================
          # PAINEL TRANSPARENTE
          # ==========================================================

          painel = Image.new(
              "RGBA",
              (LARGURA, ALTURA),
              (0, 0, 0, 0)
          )

          painel_draw = ImageDraw.Draw(painel)

          painel_draw.rounded_rectangle(
              (
                  margem_x,
                  painel_topo,
                  margem_x + 800,
                  painel_baixo
              ),
              radius=28,
              fill=(0, 0, 0, 135)
          )

          imagem = Image.alpha_composite(
              imagem.convert("RGBA"),
              painel
          ).convert("RGB")

          draw = ImageDraw.Draw(imagem)

          # ==========================================================
          # LINHA DE DESTAQUE
          # ==========================================================

          draw.rounded_rectangle(
              (
                  margem_x,
                  painel_topo,
                  margem_x + 14,
                  painel_baixo
              ),
              radius=7,
              fill="white"
          )

          # ==========================================================
          # TEXTO
          # ==========================================================

          y = painel_topo + 30

          for indice, linha in enumerate(linhas):

              caixa = draw.textbbox(
                  (0, 0),
                  linha,
                  font=fonte_principal,
                  stroke_width=5
              )

              altura = (
                  caixa[3] - caixa[1]
              )

              draw.text(
                  (
                      margem_x + 38,
                      y
                  ),
                  linha,
                  font=fonte_principal,
                  fill="white",
                  stroke_width=7,
                  stroke_fill="black"
              )

              y += altura + espacamento

          # ==========================================================
          # BORDA DISCRETA
          # ==========================================================

          draw.rounded_rectangle(
              (
                  8,
                  8,
                  LARGURA - 8,
                  ALTURA - 8
              ),
              radius=18,
              outline="white",
              width=4
          )

          # ==========================================================
          # SALVAR
          # ==========================================================

          imagem.save(
              OUTPUT_FILE,
              "JPEG",
              quality=95,
              optimize=True
          )

          # ==========================================================
          # CRÉDITO PEXELS SEPARADO
          # ==========================================================

          with open(
              CREDIT_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  "Imagem utilizada na thumbnail: Pexels\n"
              )
              f.write(
                  f"Fotógrafo: {fotografo}\n"
              )
              f.write(
                  f"Página da imagem: {pagina_pexels}\n"
              )
              f.write(
                  "Fonte: https://www.pexels.com/\n"
              )

          # ==========================================================
          # VALIDAÇÃO FINAL
          # ==========================================================

          final = Image.open(
              OUTPUT_FILE
          )

          if final.size != (1280, 720):
              print(
                  f"ERRO: tamanho final incorreto: {final.size}"
              )
              sys.exit(1)

          print("==========================================")
          print("THUMBNAIL TEMÁTICA GERADA COM SUCESSO")
          print("==========================================")
          print(f"Tamanho: {final.size}")
          print(f"Imagem Pexels: {foto_id}")
          print(f"Fotógrafo: {fotografo}")
          print("Sem marca d'água.")
          print("Sem logotipo.")
          print("Sem assinatura.")
          print("Crédito salvo separadamente.")
          print("==========================================")
          PY

      - name: Salvar thumbnail para download
        uses: actions/upload-artifact@v4
        with:
          name: thumbnail-youtube
          path: |
            resultado/thumbnail.jpg
            resultado/pexels-credit.txt
          if-no-files-found: error

      - name: Finalizar
        run: |
          echo "=========================================="
          echo "WORKFLOW DE THUMBNAIL FINALIZADO"
          echo "=========================================="
          echo "Thumbnail: thumbnail.jpg"
          echo "Crédito: pexels-credit.txt"
          echo "Disponível no artefato thumbnail-youtube."