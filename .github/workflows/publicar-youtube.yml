name: Publicar Short no YouTube

on:
  workflow_run:
    workflows: ["Processar pedido de Short"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  publicar:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. BAIXAR SHORT
      # ==========================================

      - name: Baixar Short gerado
        uses: actions/download-artifact@v4
        with:
          name: short-gerado
          path: resultado
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}


      # ==========================================
      # 2. CONFIGURAR PYTHON
      # ==========================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # 3. INSTALAR BIBLIOTECAS
      # ==========================================

      - name: Instalar bibliotecas
        run: |
          pip install \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2 \
            requests \
            pillow


      # ==========================================
      # 4. CRIAR THUMBNAIL AUTOMÁTICA
      # ==========================================

      - name: Criar thumbnail automática
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |

          python <<'PY'

          import os
          import json
          import re
          import requests

          from PIL import Image, ImageDraw, ImageFont, ImageFilter


          # ==========================================
          # ARQUIVOS
          # ==========================================

          metadata_file = "resultado/youtube-metadata.json"
          cenas_file = "resultado/cenas.json"

          thumbnail_file = "resultado/thumbnail.jpg"


          if not os.path.isfile(metadata_file):
              raise Exception(
                  "youtube-metadata.json não encontrado."
              )


          if not os.path.isfile(cenas_file):
              raise Exception(
                  "cenas.json não encontrado."
              )


          # ==========================================
          # LER METADADOS
          # ==========================================

          with open(
              metadata_file,
              "r",
              encoding="utf-8"
          ) as f:

              metadata = json.load(f)


          titulo = str(
              metadata.get("titulo", "")
          ).strip()


          if not titulo:
              raise Exception(
                  "Título não encontrado."
              )


          # ==========================================
          # LER CENAS
          # ==========================================

          with open(
              cenas_file,
              "r",
              encoding="utf-8"
          ) as f:

              cenas = json.load(f)


          # ==========================================
          # ESCOLHER BUSCA PARA THUMBNAIL
          # ==========================================

          busca = ""

          if isinstance(cenas, list):

              for cena in cenas:

                  if isinstance(cena, dict):

                      valor = str(
                          cena.get("busca", "")
                      ).strip()

                      if valor:

                          busca = valor
                          break


          elif isinstance(cenas, dict):

              lista = cenas.get("cenas", [])

              if isinstance(lista, list):

                  for cena in lista:

                      if isinstance(cena, dict):

                          valor = str(
                              cena.get("busca", "")
                          ).strip()

                          if valor:

                              busca = valor
                              break


          if not busca:

              busca = titulo


          print("")
          print("======================================")
          print("CRIANDO THUMBNAIL")
          print("======================================")
          print("")
          print("Título:", titulo)
          print("Busca Pexels:", busca)
          print("")


          # ==========================================
          # API PEXELS
          # ==========================================

          pexels_key = os.environ.get(
              "PEXELS_API_KEY",
              ""
          ).strip()


          if not pexels_key:
              raise Exception(
                  "PEXELS_API_KEY não encontrada."
              )


          headers = {
              "Authorization": pexels_key,
              "User-Agent": "Mozilla/5.0"
          }


          params = {
              "query": busca,
              "per_page": 10,
              "orientation": "landscape",
              "size": "large",
          }


          resposta = requests.get(
              "https://api.pexels.com/v1/search",
              headers=headers,
              params=params,
              timeout=60
          )


          resposta.raise_for_status()


          dados = resposta.json()


          fotos = dados.get(
              "photos",
              []
          )


          if not fotos:

              # Segunda tentativa usando o título
              params["query"] = titulo

              resposta = requests.get(
                  "https://api.pexels.com/v1/search",
                  headers=headers,
                  params=params,
                  timeout=60
              )

              resposta.raise_for_status()

              dados = resposta.json()

              fotos = dados.get(
                  "photos",
                  []
              )


          if not fotos:
              raise Exception(
                  "Nenhuma imagem encontrada no Pexels."
              )


          # ==========================================
          # BAIXAR PRIMEIRA IMAGEM VÁLIDA
          # ==========================================

          imagem_baixada = False

          for foto in fotos:

              fontes = foto.get(
                  "src",
                  {}
              )

              url = (
                  fontes.get("large2x")
                  or fontes.get("large")
                  or fontes.get("original")
              )

              if not url:
                  continue


              try:

                  imagem = requests.get(
                      url,
                      timeout=60
                  )

                  imagem.raise_for_status()

                  with open(
                      "resultado/pexels-thumb-original.jpg",
                      "wb"
                  ) as arquivo:

                      arquivo.write(
                          imagem.content
                      )

                  imagem_baixada = True

                  print(
                      "Imagem encontrada:",
                      foto.get("photographer", "Pexels")
                  )

                  break

              except Exception as erro:

                  print(
                      "Falha ao baixar imagem:",
                      erro
                  )


          if not imagem_baixada:
              raise Exception(
                  "Não foi possível baixar uma imagem do Pexels."
              )


          # ==========================================
          # ABRIR IMAGEM
          # ==========================================

          imagem = Image.open(
              "resultado/pexels-thumb-original.jpg"
          ).convert("RGB")


          # ==========================================
          # FORMATO 1280 x 720
          # ==========================================

          largura = 1280
          altura = 720

          proporcao_alvo = largura / altura
          proporcao_atual = (
              imagem.width / imagem.height
          )


          if proporcao_atual > proporcao_alvo:

              nova_largura = int(
                  imagem.height * proporcao_alvo
              )

              esquerda = (
                  imagem.width - nova_largura
              ) // 2

              imagem = imagem.crop(
                  (
                      esquerda,
                      0,
                      esquerda + nova_largura,
                      imagem.height
                  )
              )

          else:

              nova_altura = int(
                  imagem.width / proporcao_alvo
              )

              topo = (
                  imagem.height - nova_altura
              ) // 2

              imagem = imagem.crop(
                  (
                      0,
                      topo,
                      imagem.width,
                      topo + nova_altura
                  )
              )


          imagem = imagem.resize(
              (largura, altura),
              Image.Resampling.LANCZOS
          )


          # ==========================================
          # FUNDO ESCURECIDO
          # ==========================================

          fundo = imagem.copy()

          fundo = fundo.filter(
              ImageFilter.GaussianBlur(0.8)
          )


          # Gradiente escuro nas áreas do texto
          overlay = Image.new(
              "RGBA",
              (largura, altura),
              (0, 0, 0, 0)
          )


          desenho_overlay = ImageDraw.Draw(
              overlay
          )


          for y in range(altura):

              if y < 180:

                  alpha = int(
                      190 * (1 - y / 180)
                  )

              else:

                  alpha = 0

              desenho_overlay.rectangle(
                  (0, y, largura, y + 1),
                  fill=(0, 0, 0, alpha)
              )


          for y in range(altura - 300, altura):

              progresso = (
                  y - (altura - 300)
              ) / 300

              alpha = int(
                  200 * progresso
              )

              desenho_overlay.rectangle(
                  (0, y, largura, y + 1),
                  fill=(0, 0, 0, alpha)
              )


          imagem = Image.alpha_composite(
              fundo.convert("RGBA"),
              overlay
          )


          # ==========================================
          # FONTE
          # ==========================================

          fontes_possiveis = [

              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSans-Bold.ttf",

              "/usr/share/fonts/truetype/liberation2/"
              "LiberationSans-Bold.ttf",

          ]


          fonte_path = None

          for caminho in fontes_possiveis:

              if os.path.isfile(caminho):

                  fonte_path = caminho
                  break


          if not fonte_path:

              raise Exception(
                  "Fonte para thumbnail não encontrada."
              )


          # ==========================================
          # QUEBRAR TÍTULO
          # ==========================================

          titulo_limpo = re.sub(
              r"\s+",
              " ",
              titulo
          ).strip()


          palavras = titulo_limpo.split()

          linhas = []
          linha_atual = ""


          tamanho_fonte = 72


          fonte = ImageFont.truetype(
              fonte_path,
              tamanho_fonte
          )


          desenho = ImageDraw.Draw(
              imagem
          )


          max_largura = 1080


          for palavra in palavras:

              teste = (
                  linha_atual + " " + palavra
              ).strip()

              caixa = desenho.textbbox(
                  (0, 0),
                  teste,
                  font=fonte
              )

              largura_texto = (
                  caixa[2] - caixa[0]
              )

              if (
                  largura_texto <= max_largura
                  or not linha_atual
              ):

                  linha_atual = teste

              else:

                  linhas.append(
                      linha_atual
                  )

                  linha_atual = palavra


          if linha_atual:

              linhas.append(
                  linha_atual
              )


          # No máximo 3 linhas
          if len(linhas) > 3:

              linhas = linhas[:3]

              linhas[-1] = (
                  linhas[-1][:35].rstrip()
                  + "..."
              )


          # ==========================================
          # POSIÇÃO DO TEXTO
          # ==========================================

          alturas_linhas = []

          for linha in linhas:

              caixa = desenho.textbbox(
                  (0, 0),
                  linha,
                  font=fonte,
                  stroke_width=3
              )

              alturas_linhas.append(
                  caixa[3] - caixa[1]
              )


          espaco = 12

          altura_total = (
              sum(alturas_linhas)
              + espaco * (len(linhas) - 1)
          )


          y = (
              altura - altura_total
          ) // 2


          # ==========================================
          # TEXTO COM CONTORNO
          # ==========================================

          for linha, altura_linha in zip(
              linhas,
              alturas_linhas
          ):

              caixa = desenho.textbbox(
                  (0, 0),
                  linha,
                  font=fonte,
                  stroke_width=4
              )

              largura_texto = (
                  caixa[2] - caixa[0]
              )

              x = (
                  largura - largura_texto
              ) // 2


              # sombra
              desenho.text(
                  (
                      x + 5,
                      y + 7
                  ),
                  linha,
                  font=fonte,
                  fill=(0, 0, 0, 210),
                  stroke_width=6,
                  stroke_fill=(0, 0, 0, 210)
              )


              # texto principal
              desenho.text(
                  (x, y),
                  linha,
                  font=fonte,
                  fill=(255, 255, 255),
                  stroke_width=4,
                  stroke_fill=(0, 0, 0)
              )


              y += (
                  altura_linha
                  + espaco
              )


          # ==========================================
          # SALVAR THUMBNAIL
          # ==========================================

          imagem = imagem.convert("RGB")


          qualidade = 92

          while qualidade >= 60:

              imagem.save(
                  thumbnail_file,
                  "JPEG",
                  quality=qualidade,
                  optimize=True
              )

              tamanho = os.path.getsize(
                  thumbnail_file
              )

              if tamanho <= 2_000_000:

                  break

              qualidade -= 5


          tamanho_final = os.path.getsize(
              thumbnail_file
          )


          if tamanho_final > 2_000_000:

              raise Exception(
                  "Thumbnail ficou maior que 2 MB."
              )


          print("")
          print(
              "Thumbnail criada:",
              thumbnail_file
          )

          print(
              "Tamanho:",
              round(
                  tamanho_final / 1024,
                  1
              ),
              "KB"
          )

          print("")
          print(
              "======================================"
          )
          print(
              "✅ THUMBNAIL CRIADA"
          )
          print(
              "======================================"
          )

          PY


      # ==========================================
      # 5. PUBLICAR NO YOUTUBE
      # ==========================================

      - name: Publicar Short no YouTube
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |

          python <<'PY'

          import os
          import json
          import re

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import (
              MediaFileUpload
          )


          # ==========================================
          # ARQUIVOS
          # ==========================================

          arquivo = (
              "resultado/short-final.mp4"
          )

          metadata_file = (
              "resultado/youtube-metadata.json"
          )

          thumbnail_file = (
              "resultado/thumbnail.jpg"
          )


          if not os.path.isfile(arquivo):

              raise Exception(
                  "short-final.mp4 não encontrado."
              )


          if not os.path.isfile(
              metadata_file
          ):

              raise Exception(
                  "youtube-metadata.json não encontrado."
              )


          if not os.path.isfile(
              thumbnail_file
          ):

              raise Exception(
                  "thumbnail.jpg não encontrado."
              )


          # ==========================================
          # METADADOS
          # ==========================================

          with open(
              metadata_file,
              "r",
              encoding="utf-8"
          ) as f:

              metadata = json.load(f)


          titulo = str(
              metadata.get(
                  "titulo",
                  ""
              )
          ).strip()


          descricao = str(
              metadata.get(
                  "descricao",
                  ""
              )
          ).strip()


          hashtags = str(
              metadata.get(
                  "hashtags",
                  ""
              )
          ).strip()


          # ==========================================
          # VALIDAR TÍTULO
          # ==========================================

          if not titulo:

              raise Exception(
                  "O Gemini não gerou um título."
              )


          titulo = titulo[:70].strip()


          # ==========================================
          # VALIDAR DESCRIÇÃO
          # ==========================================

          if not descricao:

              raise Exception(
                  "O Gemini não gerou uma descrição."
              )


          # ==========================================
          # HASHTAGS
          # ==========================================

          hashtags_encontradas = re.findall(
              r"#[A-Za-zÀ-ÿ0-9_]+",
              hashtags
          )


          hashtags_unicas = []


          for hashtag in hashtags_encontradas:

              if hashtag.lower() not in [
                  h.lower()
                  for h in hashtags_unicas
              ]:

                  hashtags_unicas.append(
                      hashtag
                  )


          if len(hashtags_unicas) != 5:

              raise Exception(
                  "O Gemini não gerou exatamente "
                  f"5 hashtags. Recebidas: "
                  f"{len(hashtags_unicas)}"
              )


          hashtags_final = " ".join(
              hashtags_unicas
          )


          # ==========================================
          # DESCRIÇÃO FINAL
          # ==========================================

          descricao_final = (

              descricao.strip()

              + "\n\n"

              + hashtags_final

              + "\n\n"

              + "🎬 Vídeo criado automaticamente.\n"

              + "🎥 Vídeos utilizados: Pexels.\n"

              + "https://www.pexels.com/"

          )


          # ==========================================
          # MOSTRAR METADADOS
          # ==========================================

          print("")
          print(
              "======================================"
          )

          print(
              "METADADOS DO SHORT"
          )

          print(
              "======================================"
          )

          print("")

          print("TÍTULO:")
          print(titulo)

          print("")

          print("DESCRIÇÃO:")
          print(descricao_final)

          print("")

          print("HASHTAGS:")
          print(hashtags_final)

          print("")


          # ==========================================
          # AUTENTICAÇÃO
          # ==========================================

          refresh_token = os.environ[
              "YOUTUBE_REFRESH_TOKEN"
          ].strip()


          client_id = os.environ[
              "YOUTUBE_CLIENT_ID"
          ].strip()


          client_secret = os.environ[
              "YOUTUBE_CLIENT_SECRET"
          ].strip()


          if not refresh_token:

              raise Exception(
                  "YOUTUBE_REFRESH_TOKEN não encontrada."
              )


          if not client_id:

              raise Exception(
                  "YOUTUBE_CLIENT_ID não encontrada."
              )


          if not client_secret:

              raise Exception(
                  "YOUTUBE_CLIENT_SECRET não encontrada."
              )


          credentials = Credentials(

              token=None,

              refresh_token=refresh_token,

              token_uri=(
                  "https://oauth2.googleapis.com/token"
              ),

              client_id=client_id,

              client_secret=client_secret,

              scopes=[

                  "https://www.googleapis.com/auth/"
                  "youtube.upload"

              ],

          )


          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )


          # ==========================================
          # DADOS DO VÍDEO
          # ==========================================

          body = {

              "snippet": {

                  "title": titulo,

                  "description": descricao_final,

                  "categoryId": "22",

              },

              "status": {

                  "privacyStatus": "private",

                  "selfDeclaredMadeForKids": False,

              },

          }


          # ==========================================
          # UPLOAD DO VÍDEO
          # ==========================================

          print("")
          print(
              "Enviando vídeo para o YouTube..."
          )


          request = youtube.videos().insert(

              part="snippet,status",

              body=body,

              media_body=MediaFileUpload(

                  arquivo,

                  mimetype="video/mp4",

                  resumable=True,

              ),

          )


          resposta = request.execute()


          video_id = resposta["id"]


          print("")
          print(
              "Vídeo enviado."
          )

          print(
              "ID:",
              video_id
          )


          # ==========================================
          # ENVIAR THUMBNAIL
          # ==========================================

          print("")
          print(
              "Enviando thumbnail personalizada..."
          )


          thumbnail_request = (
              youtube.thumbnails().set(

                  videoId=video_id,

                  media_body=MediaFileUpload(

                      thumbnail_file,

                      mimetype="image/jpeg",

                      resumable=False,

                  ),

              )
          )


          thumbnail_request.execute()


          print("")
          print(
              "======================================"
          )

          print(
              "✅ THUMBNAIL ENVIADA COM SUCESSO"
          )

          print(
              "======================================"
          )


          # ==========================================
          # SUCESSO
          # ==========================================

          print("")

          print(
              "======================================"
          )

          print(
              "✅ SHORT PUBLICADO COM SUCESSO"
          )

          print(
              "======================================"
          )

          print(
              "ID:",
              video_id
          )

          print(
              "Título:",
              titulo
          )

          print(
              "Hashtags:",
              hashtags_final
          )

          print(
              "Thumbnail:",
              "resultado/thumbnail.jpg"
          )

          print(
              "https://www.youtube.com/watch?v="
              + video_id
          )

          print(
              "======================================"
          )


          PY
