name: Publicar Short no YouTube

on:
  workflow_run:
    workflows: ["Processar pedido de Short"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  publicar:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Short gerado
        uses: actions/download-artifact@v4
        with:
          name: short-gerado
          path: resultado
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar bibliotecas do YouTube
        run: |
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Publicar no YouTube
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TITULO_ISSUE: ${{ github.event.workflow_run.display_title }}
        run: |
          python <<'PY'
          import os

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          refresh_token = os.environ["YOUTUBE_REFRESH_TOKEN"]
          client_id = os.environ["YOUTUBE_CLIENT_ID"]
          client_secret = os.environ["YOUTUBE_CLIENT_SECRET"]

          credentials = Credentials(
              token=None,
              refresh_token=refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=client_id,
              client_secret=client_secret,
              scopes=["https://www.googleapis.com/auth/youtube.upload"],
          )

          youtube = build("youtube", "v3", credentials=credentials)

          titulo = os.environ.get("TITULO_ISSUE", "Short automático")
          titulo = titulo.replace("Criar Short:", "").strip()
          titulo = titulo[:100]

          body = {
              "snippet": {
                  "title": titulo,
                  "description": "Short criado automaticamente.\n\nVídeos utilizados: Pexels\nhttps://www.pexels.com/",
                  "categoryId": "22",
              },
              "status": {
                  "privacyStatus": "private",
                  "selfDeclaredMadeForKids": False,
              },
          }

          arquivo = "resultado/short-final.mp4"

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=MediaFileUpload(
                  arquivo,
                  mimetype="video/mp4",
                  resumable=True,
              ),
          )

          resposta = request.execute()

          video_id = resposta["id"]

          print("======================================")
          print("SHORT PUBLICADO COM SUCESSO!")
          print(f"https://www.youtube.com/watch?v={video_id}")
          print("======================================")
          PY
